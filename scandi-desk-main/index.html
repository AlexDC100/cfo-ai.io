<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFO AI — CFO-grade analysis for European SMEs</title>
    <meta
      name="description"
      content="Upload your trial balance. Get analysis in 30 seconds. Auto-detects 15 European chart-of-accounts standards. Built for SME CFOs across Romania, Germany, France, Spain."
    />
    <meta name="author" content="CFO AI" />
    <link rel="canonical" href="https://cfoai.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph — used by LinkedIn, Facebook, Slack, Discord, iMessage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CFO AI" />
    <meta property="og:title" content="CFO AI — CFO-grade analysis for European SMEs" />
    <meta
      property="og:description"
      content="Upload your trial balance. Get analysis in 30 seconds. Auto-detects 15 European chart-of-accounts standards."
    />
    <meta property="og:url" content="https://cfoai.app/" />
    <meta property="og:image" content="https://cfoai.app/og/homepage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CFO AI dashboard preview with the tagline 'CFO-grade analysis for European SMEs'." />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card — used by X (Twitter). summary_large_image renders the 1200×630 hero. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cfo_ai" />
    <meta name="twitter:title" content="CFO AI — CFO-grade analysis for European SMEs" />
    <meta
      name="twitter:description"
      content="Upload your trial balance. Get analysis in 30 seconds. Auto-detects 15 European chart-of-accounts standards."
    />
    <meta name="twitter:image" content="https://cfoai.app/og/homepage.png" />
    <meta name="twitter:image:alt" content="CFO AI dashboard preview with the tagline 'CFO-grade analysis for European SMEs'." />

    <!-- Theme — sets the browser chrome color when shared on mobile. -->
    <meta name="theme-color" content="#05070A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
