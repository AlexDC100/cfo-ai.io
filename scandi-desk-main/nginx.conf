server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for fingerprinted assets emitted by Vite
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path renders index.html so React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry HTML so deploys propagate immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
