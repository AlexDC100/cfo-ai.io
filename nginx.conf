server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression — Caddy fronts this container on the VPS and compresses,
    # but nginx must not depend on that (any deploy without Caddy served
    # the 800 KB entry JS raw — found 2026-08-04). gzip_static serves the
    # pre-compressed .gz files Vite emits at build time (zero CPU); the
    # dynamic gzip below covers everything else.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/geo+json application/manifest+json text/plain;
    gzip_static on;

    # Long cache for fingerprinted assets emitted by Vite
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Downloadable templates — force Content-Disposition: attachment so the
    # browser always *downloads* the .xlsx rather than trying to render it
    # in-tab. Some Windows + macOS browser combos treat
    # `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
    # as previewable and open a blank page instead of triggering the
    # download, even when the FE markup includes the HTML5 `download`
    # attribute. Setting the header server-side overrides that and matches
    # what `<a download>` is asking for. `try_files $uri =404` so a typo
    # never falls through to the SPA's index.html (would otherwise have
    # served HTML under a .xlsx URL — confusing).
    location /templates/ {
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — every unknown path renders index.html so React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry HTML so deploys propagate immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
