server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Request body ceiling (added 2026-09-06) ────────────────────────
    #
    # STATED, not inherited. nginx's compiled-in default is 1m, which
    # happened to be right — but "right by accident" is not a number
    # anyone can cite, and the first person to add a proxied upload
    # location here would have had to discover the default the hard way.
    #
    # WHAT THIS HOP ACTUALLY OWNS. This server block serves the Vite SPA
    # and nothing else: there is no `proxy_pass` in this file. On the VPS
    # the public ingress is `scandia-caddy`, whose `@api path /api/*`
    # matcher reverse-proxies STRAIGHT to `cfo-ai-backend:8000` (see
    # deploy/cfo-ai-vps/Caddyfile:110-123) — API traffic never passes
    # through nginx. So this line bounds only what a caller can push at
    # the static container, and it is NOT the API's cap.
    #
    # The API's cap is enforced twice, on purpose, and neither place is
    # here: `BodyLimitMiddleware` in src/engine/api/server.py holds
    # 8 MiB general / 36 MiB for the two document-bearing paths inside
    # the app (so the limit survives a direct hit on :8000, a different
    # front, or a future ingress), and the Caddy front needs its own
    # `request_body { max_size 36MB }` on the @api handler — that file
    # lives on the VPS and is the operator's to change.
    #
    # 1 MiB is far above anything this hop legitimately receives: every
    # request it answers is a GET for an asset or index.html.
    client_max_body_size 1m;

    # ── Security headers (added 2026-09-05) ────────────────────────────
    #
    # MEASURED on https://cfo-ai.io on 2026-09-05, before this change:
    # NO strict-transport-security, NO content-security-policy, NO
    # x-frame-options, NO x-content-type-options. The API half of this
    # lives in src/engine/api/server.py (SECURITY_HEADERS +
    # SecurityHeadersMiddleware); this is the SPA half.
    #
    # THE NGINX TRAP THIS FILE WALKS INTO IF YOU EDIT IT: `add_header` in
    # a `location` block DISCARDS every add_header inherited from the
    # server block. Three of the four locations below already set their
    # own Cache-Control / Content-Disposition, so a single server-level
    # block would have silently dropped these headers on /assets/,
    # /templates/ and /index.html — i.e. on the entry HTML, the one
    # response where X-Frame-Options and the CSP actually matter. They
    # are therefore repeated in every location that sets any header of
    # its own. If you add a location with an `add_header`, repeat them
    # there too. Gate: scripts/check_launch_headers.py.
    #
    # `always` so the headers are present on error responses too.
    #
    # HSTS: one year, subdomains included. NO `preload` — that is a
    # submission to a browser-vendor list and effectively irreversible;
    # it is the owner's decision, not a deploy's.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
    #
    # CSP — REPORT-ONLY, deliberately. A hard CSP shipped onto a Vite SPA
    # without being tested against it is a P0 waiting to happen: one
    # missing origin and the app is a blank page for every visitor, with
    # nothing in the server logs to say why. This policy is set at the
    # level the app already runs at, so it reports nothing today and
    # therefore cannot add console noise to a launch that requires zero
    # console errors — what it DOES pin, from day one, is the two
    # directives that have no legitimate use here at all: the page may
    # not be framed, and no plugin may be loaded.
    #
    # BACKLOG (ticket LB-CSP-1): tighten to a real allowlist —
    #   default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
    #   img-src 'self' data: blob:; font-src 'self' data:;
    #   connect-src 'self' https://<project>.supabase.co https://api.stripe.com;
    #   frame-src https://js.stripe.com; frame-ancestors 'none'; object-src 'none';
    #   base-uri 'self'; form-action 'self'
    # — ship THAT as Report-Only first, watch the reports for a week with
    # a report endpoint configured, and only then enforce.
    add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Compression — Caddy fronts this container on the VPS and compresses,
    # but nginx must not depend on that (any deploy without Caddy served
    # the 800 KB entry JS raw — found 2026-08-04). gzip_static serves the
    # pre-compressed .gz files Vite emits at build time (zero CPU); the
    # dynamic gzip below covers everything else.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/geo+json application/manifest+json text/plain;
    gzip_static on;

    # Long cache for fingerprinted assets emitted by Vite
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because this block's own add_header discards the
        # server-level set. See the note at the top of this file.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    # Downloadable templates — force Content-Disposition: attachment so the
    # browser always *downloads* the .xlsx rather than trying to render it
    # in-tab. Some Windows + macOS browser combos treat
    # `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
    # as previewable and open a blank page instead of triggering the
    # download, even when the FE markup includes the HTML5 `download`
    # attribute. Setting the header server-side overrides that and matches
    # what `<a download>` is asking for. `try_files $uri =404` so a typo
    # never falls through to the SPA's index.html (would otherwise have
    # served HTML under a .xlsx URL — confusing).
    location /templates/ {
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated because this block's own add_header discards the
        # server-level set. See the note at the top of this file.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Legal documents — prerendered HTML, served AHEAD of the SPA ─────
    #
    # WHY THIS BLOCK EXISTS AT ALL. `vite build` writes the six documents as
    # real files (dist/privacy/index.html, dist/ro/privacy/index.html, …), and
    # the SPA fallback below would already find them via its `$uri/` element:
    # `/privacy` is not a file, `/privacy/` IS a directory, so try_files does
    # an internal redirect and `index index.html` serves it. That works — and
    # it works by inference from two directives interacting, in a file whose
    # header already documents one nginx inheritance trap. `curl
    # https://cfo-ai.io/privacy` returning the Privacy Policy is a stated
    # requirement, not something to leave resting on `$uri/` semantics that
    # the next person to touch the fallback could remove without noticing.
    # So it is written down, and it 404s rather than silently falling through
    # to the SPA if the prerender step ever stops running — a visible failure
    # instead of a page that looks fine and contains no policy.
    #
    # Regex locations are evaluated before the `/` prefix location, so these
    # win. `?$` accepts the trailing slash a crawler may follow.
    #
    # no-store, like /index.html: these are the documents a regulator or a
    # payment processor reads, and a stale cached copy of a legal document is
    # exactly the wrong thing to serve after the owner publishes a revision.
    location ~ ^/(privacy|terms|cookies)/?$ {
        add_header Cache-Control "no-store" always;
        # Repeated because this block's own add_header discards the
        # server-level set. See the note at the top of this file.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        try_files /$1/index.html =404;
    }

    # The language-pinned twins — the `ro` hreflang alternates.
    location ~ ^/ro/(privacy|terms|cookies)/?$ {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        try_files /ro/$1/index.html =404;
    }

    # SPA fallback — every unknown path renders index.html so React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry HTML so deploys propagate immediately
    location = /index.html {
        add_header Cache-Control "no-store";
        # Repeated because this block's own add_header discards the
        # server-level set — and this is the response where X-Frame-Options
        # and the CSP matter most. See the note at the top of this file.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }
}
