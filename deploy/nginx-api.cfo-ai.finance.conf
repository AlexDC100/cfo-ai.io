# /etc/nginx/sites-available/api.cfo-ai.finance
#
# Backend reverse proxy — fronts the FastAPI service (uvicorn) running on
# 127.0.0.1:8000 (managed by the systemd unit `cfo-ai-api.service`).
#
# After symlinking into sites-enabled and reloading nginx, run certbot:
#   sudo certbot --nginx -d api.cfo-ai.finance

server {
    listen 80;
    listen [::]:80;
    server_name api.cfo-ai.finance;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cfo-ai.finance;

    # certbot will populate these:
    #   ssl_certificate     /etc/letsencrypt/live/api.cfo-ai.finance/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/api.cfo-ai.finance/privkey.pem;

    # Body size — trial balances + spreadsheets can be large. 25 MB is
    # comfortable for the current uploads; raise if needed.
    client_max_body_size 25m;

    # Read/write timeouts — the LLM stream and the analysis pipeline can
    # legitimately exceed nginx's default 60s.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # Streaming endpoints (Ask CFO AI SSE, /api/ask). Disable buffering
    # so tokens reach the browser as they're produced.
    location /api/ask {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # All other API routes
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
