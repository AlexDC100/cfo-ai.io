# /etc/nginx/sites-available/cfo-ai.finance
#
# Frontend host — serves the Vite SPA build out of /var/www/cfo-ai.finance.
# SPA fallback: any non-asset path falls back to /index.html so React
# Router owns client-side routing (/pricing, /dashboard, /signup, etc.).
#
# After symlinking into sites-enabled and reloading nginx, run certbot:
#   sudo certbot --nginx -d cfo-ai.finance -d www.cfo-ai.finance
# Certbot will add the SSL block automatically and set up renewal.

server {
    listen 80;
    listen [::]:80;
    server_name cfo-ai.finance www.cfo-ai.finance;

    # ACME challenge for certbot. After certbot runs the first time this
    # block is still useful for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else → HTTPS (certbot will rewrite this block, but keep
    # the redirect explicit so a fresh nginx config works pre-certbot).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cfo-ai.finance www.cfo-ai.finance;

    # certbot will populate these after running:
    #   ssl_certificate     /etc/letsencrypt/live/cfo-ai.finance/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/cfo-ai.finance/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cfo-ai.finance/dist;
    index index.html;

    # Long-cache the hashed asset bundles. Vite emits filenames like
    # index-B4n7NyQA.js / index-ie8sWDz4.css — the hash makes immutable
    # caching safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown path (e.g. /pricing, /dashboard) gets
    # index.html and React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers — defensible defaults. Tighten CSP later if needed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # gzip for text assets
    gzip on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;
    gzip_min_length 1024;

    # Body size — only ever uploads via API at api.cfo-ai.finance, so
    # the FE host can stay tiny.
    client_max_body_size 1m;
}
