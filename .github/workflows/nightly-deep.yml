# Nightly deep battery — canonical_bs v2 (docs/CANONICAL_BS_V2_CONTRACT.md).
#
# Five jobs, all heavier / longer than the PR battery is allowed to be,
# or re-runs of a PR gate whose subject can change without any PR
# touching it:
#
#   deep-properties   tests/engine/test_properties.py at HYPOTHESIS_PROFILE=deep
#                     (fresh entropy, 10-15x example counts, print_blob). A
#                     failing example is shrunk and written to
#                     corpus/quarantine/<sha16>/ by the suite's quarantine
#                     writer — uploaded as an artifact for pinning.
#
#   corpus-replay     the full golden corpus replay (every case, all five
#                     artifacts byte-compared). Same gate as the PR battery,
#                     re-run nightly so an environment/dependency drift is
#                     caught even on a quiet main.
#
#   prod-canary       scripts/prod_canary_replay.py — the sentinel case
#                     (prod_scandia_frozen, corpus id saga_10_col) replayed
#                     offline in the checkout AND, when the PROD_SSH_KEY /
#                     PROD_HOST secrets exist, inside the running
#                     cfo-ai-backend container on the VPS with a byte-compare
#                     of the prod-produced served envelope vs the repo golden.
#                     Those two secrets are OPTIONAL and do not exist yet in
#                     this repo (only SUPABASE_* / ANTHROPIC_API_KEY /
#                     MISTRAL_API_KEY do) — when absent the script prints a
#                     documented SKIP and exits 0; the operator runs the prod
#                     half manually over ssh, same habit as measure_bs_drift.
#
#   pack-integrity    the jurisdiction packs are the RUNTIME
#                     classification source since the Phase 3+4 cutover.
#                     Lint + cross-pack effective-window tiling + both
#                     frozen-port drift alarms + cross-path shadow (all
#                     also in the PR battery), plus the one analysis too
#                     noisy to gate a PR on: RULE COVERAGE of every
#                     corpus account code against the RO pack.
#
#   corpus-policy     data-hygiene gate + scrub-tooling unreachability.
#                     Both describe the tree as it is TODAY, and a merge
#                     can open a hole in either without touching a file
#                     in the PR job's paths filter — a new data payload,
#                     a new workflow, a new deploy script, a new local
#                     git hook. Nightly closes that window.
#
# NO LIVE API CALLS anywhere in this workflow: the property suite and the
# corpus replay both carry the anthropic-import sentinel, so the Anthropic
# credit state can never affect these gates.

name: nightly-deep

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC nightly
  workflow_dispatch: {}

jobs:
  deep-properties:
    name: Property suite (deep profile)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Deep property run (fresh entropy, high counts)
        env:
          HYPOTHESIS_PROFILE: deep
        run: python -m pytest tests/engine/test_properties.py -q
      - name: Upload quarantined failing examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-quarantine
          path: corpus/quarantine/
          if-no-files-found: ignore
          retention-days: 30

  corpus-replay:
    name: Full corpus replay (golden byte-compare)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Corpus replay — every case
        run: python3 scripts/corpus_replay.py

  prod-canary:
    name: Prod canary (sentinel replay, secret-guarded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Sentinel replay (offline always; prod when secrets exist)
        env:
          # Optional secrets — empty when not configured, and the script
          # then prints its documented SKIP for the prod phase (exit 0).
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: python3 scripts/prod_canary_replay.py

  # ─── Jurisdiction-pack integrity (deep) ──────────────────────────────
  # The PR battery lints the packs and checks them against the frozen
  # port snapshots. This job re-runs that nightly for the same reason
  # corpus-replay does — environment / dependency drift on a quiet main —
  # and adds the one analysis too slow and too noisy to gate a PR on:
  # RULE COVERAGE of every corpus case's account codes against the RO
  # pack. An unmatched code is a real hole (a code the classifier would
  # silently drop into "unmapped"), but it is a hole a legitimate new
  # fixture can open, so it belongs on a nightly line rather than in the
  # path a PR author has to clear.
  pack-integrity:
    name: Pack integrity (lint + tiling + drift + coverage + shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pack lint — schema + cross-pack effective-window tiling
        run: python3 scripts/pack_lint.py --root packs
      - name: Pack drift alarm — RO (packs/ro/omfp1802-v1)
        run: python3 scripts/port_ro_pack.py --check
      - name: Pack drift alarm — HU + IFRS captions
        run: python3 scripts/port_hu_pack.py --check
      # Every account code in every corpus case must be matched by a rule
      # in the RO pack. Non-RO lanes contribute 0 codes and pass trivially
      # rather than being excluded by a hardcoded case list that would
      # silently stop covering a case someone renamed.
      - name: Rule coverage — every corpus code hits an RO pack rule
        run: |
          python3 scripts/pack_lint.py packs/ro/omfp1802-v1 \
            --coverage corpus/*/expected/classification.json
      - name: Cross-path shadow consistency (production vs classify pass)
        run: python3 scripts/shadow_report.py --all

  # ─── Corpus policy (deep) ────────────────────────────────────────────
  # Same two gates the PR battery runs, re-run nightly. The lexicon and
  # the automation-surface enumeration both describe the tree as it is
  # TODAY: a merge that lands a new data payload, a new workflow, a new
  # deploy script or a new git hook can open a hole without touching any
  # file in the PR job's paths filter. Nightly closes that window.
  corpus-policy:
    name: Corpus policy (data hygiene + scrub-tooling unreachability)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # fetch-depth stays at the default 1: both gates are TREE-ONLY by
      # construction and must never become history scanners. See the
      # corpus-policy job in tier1-validation.yml for the full rationale.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # BLOCKING, stdlib-only, before install — this invariant must not
      # be silenceable by a broken dependency resolution.
      - name: Scrub-tooling unreachability (proof by absence)
        run: python3 scripts/check_scrub_tooling_unreachable.py --verbose
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Corpus data-hygiene gate (declarations + lexicon)
        run: python3 scripts/check_corpus_policy.py
      # NON-BLOCKING, output only — never a failing step.
      - name: Notices — history + real-file coverage (informational)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Corpus policy notices (informational — never blocking)"
            echo ""
            echo '```'
            python3 scripts/check_corpus_policy.py 2>&1 | grep '^NOTICE' || \
              echo "(no notices emitted)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

  # ─── DST fault harness, deep profile ──────────────────────────────────
  # 86 configs: every fault class × every stage boundary × the deterministic
  # fixtures (+ HU AI-lane where the fault applies), all through the REAL
  # pipeline composition. Failures minimize and archive to
  # corpus/quarantine/dst/<sha16>/ — uploaded as an artifact on red so the
  # seed + config + traceback survive the runner.
  dst-deep:
    name: DST fault harness (deep profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: DST deep exploration (86 configs)
        env:
          DST_PROFILE: deep
        run: python3 scripts/dst_explore.py
      - name: Upload quarantined failing configs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dst-quarantine
          path: corpus/quarantine/dst/
          if-no-files-found: ignore

  # ─── Mutation testing — full kernel, nightly ──────────────────────────
  # The C1 proof-layer gate: every scoreable mutant in the five kernel
  # modules must be killed (floors pinned at the measured 100%). ~16 min
  # on 14-core Apple Silicon; budgeted 90 min for 2-core runners. Only
  # --fresh full-run numbers are quotable (mutmut regenerates mutants and
  # resets ALL recorded results each run — docs/engine_book/mutation.md).
  mutation-kernel:
    name: Mutation testing (full kernel, 100% floors)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps (mutmut is in [dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Full kernel mutation run (--fresh, gate at pinned floors)
        run: python3 scripts/run_mutation_kernel.py --fresh --check
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: data/mutation/report-latest.json
          if-no-files-found: ignore

  # ─── Mutation testing — canonical_bs_v2 (dedicated job) ───────────────
  # Deferred from the default gate per the ~30-min budget rule (projection
  # 75–90 min, timeout-dominated). The separate --workdir is REQUIRED, not
  # cosmetic: mutmut resets all recorded results on regeneration, so a
  # scoped run in the default workdir would wipe the full-kernel job's
  # results. 85% floor is provisional until the first complete run is
  # triaged (early signal from the 107-mutant sample: zero survivors).
  mutation-canonical:
    name: Mutation testing (canonical_bs_v2, provisional floor)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps (mutmut is in [dev])
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: canonical_bs_v2 mutation run (dedicated workdir)
        run: >
          python3 scripts/run_mutation_kernel.py
          --modules canonical_bs_v2 --check
          --workdir data/mutation/canonical
      - name: Upload canonical mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-canonical
          path: data/mutation/canonical/report-latest.json
          if-no-files-found: ignore

  # ─── Lock resolution drift (informational) ────────────────────────────
  # Re-resolves the dependency closure against live PyPI and verifies the
  # guards WITHOUT writing — surfaces upstream drift (a new major, a
  # yanked wheel) days before anyone regenerates the lock for real. Needs
  # network to PyPI, so it lives here and NEVER in the blocking PR path;
  # continue-on-error keeps a PyPI outage from painting the nightly red.
  lock-drift:
    name: Lock resolution drift vs live PyPI (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Re-resolve + verify guards (writes nothing)
        run: python3 scripts/generate_lock.py --check

  # ─── Format-template promotion report (informational) ────────────────
  # Lists templates meeting the promotion bar (N confirmations across M
  # distinct companies) with the operator promotion procedure; always
  # exits 0 and refreshes data/obs/template_stats.json. Report-only —
  # promotion itself is an operator step (no PR bot by design).
  template-report:
    name: Promotable format templates (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install engine + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Promotable-templates report
        run: python3 scripts/report_promotable_templates.py
