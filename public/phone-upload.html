<!doctype html>
<!--
  CFO AI — the upload portal's PHONE page. ONE page for both routes:

    cloud  https://cfo-ai.io/phone-upload.html#m=cloud&t=<token>&k=<key>&f=<fn url>&a=<anon key>&s=<surface>
           Each file is SEALED on the phone (AES-256-GCM, name and type inside)
           with the key in the fragment — which never leaves the phone — then
           sent to a private bucket through the `phone-upload` Edge Function.
    local  http://<this computer's LAN address>:8000/api/phone-upload/local/page#m=local&t=<token>&s=<surface>
           Served by the engine running on the user's own computer; files are
           POSTed straight to it and never leave the network. (Plain http on
           a LAN address is not a secure context, so browsers switch
           WebCrypto off there: local files travel unsealed, over the local
           network only.)

  Either way every file WAITS on the PC until it is imported into the upload
  section that opened the portal (or rejected); this page shows the outcome.

  Ported from DocVex's phone upload page. Two identical copies, kept equal by
  frontend/lib/phoneUpload/__tests__/phonePage.test.ts:
    src/engine/api/phone_upload_page.html   (served by the engine, local route)
    public/phone-upload.html                (served by the site, cloud route)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>CFO AI — Upload from your phone</title>
<style>
  :root {
    --bg: #f8f8f5; --ink: #0b0e0d; --soft: #5c6461; --mute: #7c8481; --rule: #dfe2df;
    --brand: #0e7c6b; --brand-d: #0a5f52; --tint: #e6f1ee;
    --ok: #0a7c3a; --bad: #c62828; --warn: #a46a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1210; --ink: #eef2f0; --soft: #a3ada9; --mute: #7e8985; --rule: #24302c;
      --brand: #27b29b; --brand-d: #1f9682; --tint: #12302a; --ok: #4cc27a; --bad: #ef6b6b; --warn: #e2a94a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom)); }
  .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--brand); font-weight: 600; }
  h1 { font-size: 26px; line-height: 1.15; margin: 6px 0 6px; letter-spacing: -.01em; }
  .lead { color: var(--soft); margin: 0 0 18px; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 18px 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px;
    background: var(--tint); color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); }
  .actions { display: grid; gap: 10px; margin: 18px 0 8px; }
  .btn { appearance: none; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px;
    border-radius: 10px; border: 1px solid var(--rule); background: transparent; color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn:active { transform: scale(.99); }
  .btn[disabled] { opacity: .5; }
  .note { font-size: 12.5px; color: var(--mute); }
  .notice { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .notice b { display: block; margin-bottom: 2px; }
  ul.files { list-style: none; margin: 0; padding: 0; }
  ul.files li { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0;
    border-bottom: 1px solid var(--rule); }
  .thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--tint); color: var(--brand); display: grid; place-items: center;
    font-size: 10px; font-weight: 700; text-transform: uppercase; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--mute); }
  .bar { height: 3px; background: var(--rule); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .2s; }
  .state { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .state.wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .state.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .state.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .state.up { color: var(--brand); background: var(--tint); }
  .hidden { display: none !important; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">CFO AI · Upload portal</div>
  <h1>Send files to your computer</h1>
  <p class="lead" id="lead">Choose files or take a photo. They wait on your computer until you import them there.</p>
  <div><span class="pill" id="route">…</span> <span class="pill hidden" id="where"></span></div>

  <div class="notice hidden" id="closed">
    <b id="closedTitle">Upload closed</b>
    <span id="closedText">The upload window on your computer was closed. Open it again there — this page comes back by itself.</span>
  </div>

  <div class="actions" id="actions">
    <button class="btn primary" id="pick" type="button">Choose files</button>
    <button class="btn" id="camera" type="button">Take a photo</button>
  </div>
  <input id="fileInput" type="file" multiple>
  <input id="cameraInput" type="file" accept="image/*" capture="environment">
  <p class="note" id="note"></p>

  <hr>
  <ul class="files" id="files"></ul>
</main>
<script>
(function () {
  "use strict";
  var MAGIC = [0x43, 0x46, 0x4f, 0x50]; // "CFOP"
  var AAD_PREFIX = "cfoai-phone-upload:v1:";
  var SURFACES = {
    workspace: "Workspace — financial documents", company: "Company page — financial documents",
    statements: "Financial statements", periods: "Periods", products: "Products — sales file",
    sources: "Source files", budget: "Budget vs actual", chat: "Ask CFO AI — attachment", upload: "Upload"
  };

  // ── Configuration from the URL FRAGMENT (never sent to any server) ──────
  var frag = new URLSearchParams(location.hash.replace(/^#/, ""));
  var KEEP = "cfoai-phone-upload:" + location.pathname;
  var cfg = {};
  if (frag.get("t")) {
    frag.forEach(function (v, k) { cfg[k] = v; });
    try { sessionStorage.setItem(KEEP, JSON.stringify(cfg)); } catch (e) { /* private mode */ }
    // Out of the address bar (and the browser history) at once.
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ }
  } else {
    try { cfg = JSON.parse(sessionStorage.getItem(KEEP) || "{}"); } catch (e) { cfg = {}; }
  }
  var mode = cfg.m === "local" ? "local" : "cloud";
  var token = cfg.t || "";
  var $ = function (id) { return document.getElementById(id); };

  if (!token) {
    show("closed", true);
    $("closedTitle").textContent = "This link is incomplete";
    $("closedText").textContent = "Scan the QR code on your computer again.";
    show("actions", false);
    return;
  }
  $("route").textContent = mode === "local" ? "Local network — straight to your computer" : "CFO AI cloud — encrypted on this phone";
  if (cfg.s && SURFACES[cfg.s]) { $("where").textContent = SURFACES[cfg.s]; show("where", true); }
  if (cfg.acc) $("fileInput").setAttribute("accept", cfg.acc);
  if (cfg.one === "1") $("fileInput").removeAttribute("multiple");

  var canSeal = mode === "cloud" && !!(window.crypto && crypto.subtle) && !!cfg.k;
  if (mode === "cloud" && !canSeal) {
    show("closed", true);
    $("closedTitle").textContent = "This browser can't encrypt the files";
    $("closedText").textContent = "Open the link in Safari or Chrome over https.";
    show("actions", false);
    return;
  }

  function show(id, on) { $(id).classList.toggle("hidden", !on); }
  function fmt(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1048576) return Math.round(n / 1024) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }
  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // ── The two transports ─────────────────────────────────────────────────
  function fn(body) {
    var headers = { "content-type": "application/json" };
    if (cfg.a) headers.apikey = cfg.a;
    body.token = token;
    return fetch(cfg.f, { method: "POST", headers: headers, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function local(path, init) {
    init = init || {};
    init.headers = Object.assign({ "x-upload-token": token }, init.headers || {});
    return fetch("/api/phone-upload/local/" + path, init)
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }

  // ── Sealing (cloud): CFOP | 0x01 | iv(12) | AES-GCM( u32 hdrLen | hdr JSON | bytes ) ──
  var keyPromise = canSeal
    ? crypto.subtle.importKey("raw", b64urlToBytes(cfg.k), { name: "AES-GCM" }, false, ["encrypt"])
    : null;
  function seal(file) {
    return Promise.all([keyPromise, file.arrayBuffer()]).then(function (r) {
      var key = r[0], data = new Uint8Array(r[1]);
      var hdr = new TextEncoder().encode(JSON.stringify({ name: file.name || "file", type: file.type || "", size: data.length }));
      var plain = new Uint8Array(4 + hdr.length + data.length);
      new DataView(plain.buffer).setUint32(0, hdr.length);
      plain.set(hdr, 4); plain.set(data, 4 + hdr.length);
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv, additionalData: new TextEncoder().encode(AAD_PREFIX + token) }, key, plain)
        .then(function (ct) {
          var out = new Uint8Array(5 + 12 + ct.byteLength);
          out.set(MAGIC, 0); out[4] = 1; out.set(iv, 5); out.set(new Uint8Array(ct), 17);
          return new Blob([out], { type: "application/octet-stream" });
        });
    });
  }

  function put(url, blob, onProgress, headers) {
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open(headers && headers.method || "PUT", url);
      Object.keys(headers || {}).forEach(function (k) { if (k !== "method") x.setRequestHeader(k, headers[k]); });
      x.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      x.onload = function () {
        var j = {}; try { j = JSON.parse(x.responseText || "{}"); } catch (e) { /* not json */ }
        j._status = x.status;
        if (x.status >= 200 && x.status < 300) resolve(j); else reject(Object.assign(new Error("upload_" + x.status), { body: j }));
      };
      x.onerror = function () { reject(new Error("network")); };
      x.send(blob);
    });
  }

  // ── The list ───────────────────────────────────────────────────────────
  var items = [];   // { el, file, id, state }
  function row(file) {
    var li = document.createElement("li");
    var th = document.createElement("div"); th.className = "thumb";
    if (/^image\//.test(file.type)) {
      var img = document.createElement("img"); img.alt = ""; img.src = URL.createObjectURL(file); th.appendChild(img);
    } else {
      var ext = (String(file.name).split(".").pop() || "file").slice(0, 5); th.textContent = ext;
    }
    var mid = document.createElement("div");
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = file.name || "file";
    var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = fmt(file.size);
    var bar = document.createElement("div"); bar.className = "bar"; bar.appendChild(document.createElement("i"));
    mid.appendChild(nm); mid.appendChild(meta); mid.appendChild(bar);
    var st = document.createElement("span"); st.className = "state up"; st.textContent = "Queued";
    li.appendChild(th); li.appendChild(mid); li.appendChild(st);
    $("files").insertBefore(li, $("files").firstChild);
    return { li: li, bar: bar.firstChild, barWrap: bar, st: st, meta: meta };
  }
  function setState(it, cls, text) {
    it.ui.st.className = "state " + cls; it.ui.st.textContent = text;
    if (cls !== "up") it.ui.barWrap.classList.add("hidden");
  }

  var queue = [], running = 0, MAX_PAR = 2;
  function enqueue(files) {
    Array.prototype.forEach.call(files, function (f) {
      var it = { file: f, ui: row(f), id: null, state: "queued" };
      items.push(it); queue.push(it);
    });
    pump();
  }
  function pump() {
    while (running < MAX_PAR && queue.length) {
      var it = queue.shift(); running++;
      send(it).catch(function () { /* shown on the row */ }).then(function () { running--; pump(); });
    }
  }
  function errorText(e) {
    var code = e && e.body && e.body.error || e && e.message || "";
    if (/too_large|413/.test(code)) return "Too large";
    if (/closed|expired|410/.test(code)) return "Upload closed";
    if (/network/.test(code)) return "No connection";
    return "Failed";
  }
  function send(it) {
    setState(it, "up", "Sending");
    var progress = function (p) { it.ui.bar.style.width = Math.round(p * 100) + "%"; };
    var job;
    if (mode === "local") {
      job = put("/api/phone-upload/local/file?name=" + encodeURIComponent(it.file.name || "file"), it.file, progress,
        { method: "POST", "x-upload-token": token, "content-type": it.file.type || "application/octet-stream" })
        .then(function (j) { return j.id; });
    } else {
      job = seal(it.file).then(function (blob) {
        return fn({ action: "sign", size: blob.size }).then(function (s) {
          if (!s.ok) throw Object.assign(new Error(s.error || "sign"), { body: s });
          return put(s.signedUrl, blob, progress, { "content-type": "application/octet-stream", "x-upsert": "false" })
            .then(function () { return fn({ action: "done", path: s.path, size: blob.size, sealed: true }); })
            .then(function (d) { if (!d.ok) throw Object.assign(new Error(d.error || "done"), { body: d }); return d.id; });
        });
      });
    }
    return job.then(function (id) {
      it.id = id; it.state = "waiting";
      setState(it, "wait", "Waiting on computer");
    }, function (e) {
      it.state = "error";
      setState(it, "bad", errorText(e));
      if (/closed|expired|410/.test(e && e.body && e.body.error || "")) closed(true);
      throw e;
    });
  }

  // ── Following what the computer decided ────────────────────────────────
  function followStatus() {
    var ids = items.filter(function (i) { return i.state === "waiting" && i.id; }).map(function (i) { return i.id; });
    if (!ids.length) return;
    var req = mode === "local"
      ? local("status?ids=" + encodeURIComponent(ids.join(",")))
      : fn({ action: "status", ids: ids });
    req.then(function (j) {
      if (!j || !j.status) return;
      items.forEach(function (it) {
        var s = it.id && j.status[it.id];
        if (s === "accepted") { it.state = "accepted"; setState(it, "ok", "Imported"); }
        else if (s === "rejected") { it.state = "rejected"; setState(it, "bad", "Rejected"); }
      });
    }).catch(function () { /* try again next tick */ });
  }

  // ── Is the portal still open on the computer? ──────────────────────────
  function closed(on) {
    show("closed", on); show("actions", !on);
  }
  function checkOpen() {
    var req = mode === "local" ? local("info") : fn({ action: "info" });
    return req.then(function (j) {
      if (j.ok) {
        closed(false);
        $("note").textContent = (mode === "cloud" ? "Up to " + fmt(j.maxBytes) + " a file. " : "") +
          "Keep this page open — files you send later go to the same place.";
      } else if (j._status === 404) {
        closed(true);
        $("closedTitle").textContent = "This link no longer works";
        $("closedText").textContent = "Scan the QR code on your computer again.";
      } else closed(true);
    }).catch(function () { closed(true); });
  }

  $("pick").addEventListener("click", function () { $("fileInput").click(); });
  $("camera").addEventListener("click", function () { $("cameraInput").click(); });
  $("fileInput").addEventListener("change", function (e) { if (e.target.files.length) enqueue(e.target.files); e.target.value = ""; });
  $("cameraInput").addEventListener("change", function (e) { if (e.target.files.length) enqueue(e.target.files); e.target.value = ""; });

  checkOpen();
  setInterval(checkOpen, mode === "local" ? 4000 : 8000);
  setInterval(followStatus, 3000);
})();
</script>
</body>
</html>
