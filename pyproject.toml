[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scandia-engine"
version = "0.1.0"
description = "SKU Decision Engine for Scandia Trading Division"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "anthropic>=0.30",
    "pyarrow>=15.0",
    # pdfplumber gives per-token x/y coordinates, used by
    # `_public_records_parser._extract_annual_rows_geometry` to deterministically
    # separate thousands-separator gaps (~2-3 px) from inter-column gaps
    # (~20-65 px) in listafirme.ro PDFs. Pure-Python; depends only on
    # pdfminer.six. Soft-imported with text-extractor fallback in the parser.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.7", "httpx>=0.27"]

[project.scripts]
engine = "engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/engine"]
