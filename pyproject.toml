[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scandia-engine"
version = "0.1.0"
description = "SKU Decision Engine for Scandia Trading Division"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # PINNED CEILING (2026-08-22 boot-crash incident): anthropic 1.0.0
    # switched its HTTP stack to httpx2, and openai 3.x dropped httpx too —
    # the unpinned float removed the transitive httpx our code imports
    # directly, and the freshly-built container crash-looped on
    # ModuleNotFoundError. Majors are ceilinged to the tested range and
    # httpx is declared as the DIRECT dependency it always was (engine.api
    # imports it in _supabase and beyond). The Wave-2 supply-chain pass
    # replaces ceilings with a full hash lock.
    "anthropic>=0.30,<1.0",
    "httpx>=0.27",
    # OpenAI SDK — used by the ai_orchestrator GPT verifier path
    # (src/engine/api/ai_orchestrator/adapters/gpt_adapter.py). Lazy-imported;
    # orchestrator degrades to Claude-only when OPENAI_API_KEY is unset.
    "openai>=1.50,<2.0",
    # Stripe Python SDK — used by engine.api._billing for Checkout Sessions,
    # webhooks, and Customer Portal. Lazy-imported via _stripe_or_none(); the
    # billing surface returns 503 gracefully when the SDK or STRIPE_SECRET_KEY
    # is missing. Pinned >=8 to get the modern resource interface.
    "stripe>=8.0",
    "pyarrow>=15.0",
    # pdfplumber gives per-token x/y coordinates, used by
    # `_public_records_parser._extract_annual_rows_geometry` to deterministically
    # separate thousands-separator gaps (~2-3 px) from inter-column gaps
    # (~20-65 px) in listafirme.ro PDFs. Pure-Python; depends only on
    # pdfminer.six. Soft-imported with text-extractor fallback in the parser.
    "pdfplumber>=0.11",
    # F3.8 — PyMuPDF (fitz) for Romanian RAS trial-balance PDF ingestion
    # (WinMENTOR / SAGA / Ciel exporters). Position-based extraction is
    # the only reliable approach: long account names (account 1171
    # "Rezultatul reportat...") wrap visually across multiple lines,
    # but the 10 numeric columns end up on the last continuation line.
    # PyMuPDF's per-word (x,y) tuples let the leaf-filter regrop logical
    # rows by y-coordinate (2px tolerance). Empirically validated on
    # Scandia Sibiu FY2019 (249 leaf accounts, 95% movement capture,
    # account 121 exact). See country_packs/ro_romania/pdf_ingester.py.
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# hypothesis: property-based suite (tests/engine/test_properties.py).
# Floor 6.100 — resolves to the newest wheel whose requires-python still
# admits the interpreter (local venv is 3.9, CI pins 3.11), so both get a
# compatible build; the suite uses only long-stable APIs (settings
# profiles, @given, st.composite).
# pytest-benchmark: the C4 performance-budget micro-suite
# (tests/engine/bench/ + scripts/check_perf_budget.py). Tests
# importorskip it, so environments without the dev extras skip the
# bench suite instead of erroring.
dev = ["pytest>=8.0", "mypy>=1.7", "httpx>=0.27", "hypothesis>=6.100", "pytest-benchmark>=4.0"]

[project.scripts]
engine = "engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/engine"]
