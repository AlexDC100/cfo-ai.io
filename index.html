<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CFO AI — CFO-grade analysis for European SMEs</title>
    <meta
      name="description"
      content="Upload your trial balance. Get analysis in 30 seconds. Auto-detects 15 European chart-of-accounts standards. Built for SME CFOs across Romania, Germany, France, Spain."
    />
    <meta name="author" content="CFO AI" />
    <link rel="canonical" href="https://cfo-ai.io/" />

    <!-- Fonts are SELF-HOSTED via @fontsource (see frontend/index.css) —
         no fonts.googleapis.com request, nothing render-blocking, same
         speed from every region. Space Grotesk + IBM Plex Mono dropped
         entirely (zero real usage). -->


    <!-- Open Graph — used by LinkedIn, Facebook, Slack, Discord, iMessage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CFO AI" />
    <meta property="og:title" content="CFO AI — CFO-grade analysis for European SMEs" />
    <meta
      property="og:description"
      content="Upload your trial balance. Get analysis in 30 seconds. Auto-detects 15 European chart-of-accounts standards."
    />
    <meta property="og:url" content="https://cfo-ai.io/" />
    <meta property="og:image" content="https://cfo-ai.io/og/homepage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CFO AI dashboard preview with the tagline 'CFO-grade analysis for European SMEs'." />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card — used by X (Twitter). summary_large_image renders the 1200×630 hero. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cfo_ai" />
    <meta name="twitter:title" content="CFO AI — CFO-grade analysis for European SMEs" />
    <meta
      name="twitter:description"
      content="Upload your trial balance. Get analysis in 30 seconds. Auto-detects 15 European chart-of-accounts standards."
    />
    <meta name="twitter:image" content="https://cfo-ai.io/og/homepage.png" />
    <meta name="twitter:image:alt" content="CFO AI dashboard preview with the tagline 'CFO-grade analysis for European SMEs'." />

    <!-- Theme — sets the browser chrome color when shared on mobile. -->
    <meta name="theme-color" content="#05070A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />

    <!-- PWA (native-mobile pass 2026-08-04) — saved-to-homescreen opens
         fullscreen with the dark chrome and the real app icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CFO AI" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
