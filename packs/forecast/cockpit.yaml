# A year-0 cell of the statements where the actual book does not carry the
# line the way the projection splits it (depreciation apart from
# amortisation, debt interest apart from the credit line): a stated refusal,
# never a dash or a zero.
year0_not_split:
  code: "year0_not_split"
  ro: "balanța anului de bază nu separă această linie așa cum o separă proiecția"
  en: "the base year's trial balance does not split this line the way the projection does"

# ── the bridge from base (gate F9) ──────────────────────────────────────
# Every step is a difference of cumulative served flows (case minus base)
# over the window; they sum exactly to the difference in closing cash
# because opening cash is the same in both and the cash-flow statement
# closes every period.
bridge:
  steps:
    - {id: revenue, label: {ro: "Venituri", en: "Revenue"}}
    - {id: costs, label: {ro: "Costuri de exploatare", en: "Operating costs"}}
    - {id: ebitda, subtotal: true, label: {ro: "EBITDA", en: "EBITDA"}}
    - {id: working_capital, label: {ro: "Capital de lucru", en: "Working capital"}}
    - {id: capex, label: {ro: "Investiții", en: "Capital expenditure"}}
    - {id: interest_tax, label: {ro: "Dobânzi și impozit", en: "Interest and tax"}}
    - {id: dividends, label: {ro: "Dividende", en: "Dividends"}}
    - {id: debt, label: {ro: "Datorii și linia de credit", en: "Debt and the credit line"}}
    - {id: cash, total: true, label: {ro: "Numerar la sfârșit", en: "Closing cash"}}

# The months, for the dates the sentence and the numbers print.
months:
  ro: ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie", "august", "septembrie", "octombrie", "noiembrie", "decembrie"]
  en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]

# How money prints in the sentence and the four numbers: millions above the
# unit, thousands below it, one decimal.
money_display:
  million: {ro: "{value} mil. lei", en: "RON {value}M"}
  thousand: {ro: "{value} mii lei", en: "RON {value}k"}

