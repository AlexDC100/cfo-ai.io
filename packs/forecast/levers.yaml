# 6.2. unwind_days null means each balance unwinds over its own effective
# days in force; a decimal string of days replaces that window for all three.
wc_unwind:
  convention_id: "wc_unwind_ramp"
  unwind_days: null
  sentence: >-
    a working-capital balance leaves the level the base plan gives it one
    day of flow per elapsed day, over its own days on hand, so a change in
    sales or terms reaches cash across that window and never in one month.
    Annual periods land on the new level

# 6.7. Where a debt_schedule row's amounts land inside its plan year.
debt_timing:
  convention_id: "debt_timing"
  draws: first_period
  repayments: last_period
  sentence: >-
    a scheduled draw lands in the first period of its plan year and a
    scheduled repayment in the last, so a year of interest is charged on
    what was drawn and none is saved on what is repaid

# 3a.3. Concepts a reader may look for that this engine does not serve.
unserved:
  fx_rate_move:
    sentence: >-
      an exchange-rate move is not served: the book's revenue and costs are
      not split by currency
  headcount:
    sentence: >-
      headcount is not served: a trial balance carries the personnel cost
      and not the number of people
  avg_personnel_cost:
    sentence: >-
      average personnel cost is not served: it needs a headcount the book
      does not carry
  segment_growth:
    sentence: >-
      growth by segment is not served: revenue is not split by segment in
      the book
  policy_rate_shift:
    sentence: >-
      a policy-rate shift is not served: the book does not say which of its
      debt reprices with the policy rate
  stock_variation:
    sentence: >-
      the stock variation (Variația stocurilor de produse) and own work
      capitalised are not projected: they are nil in every plan year, so
      plan year one starts from the actual year's EBITDA before them
  net_provisions:
    sentence: >-
      net provisions and impairment adjustments (charges less reversals,
      outside EBITDA) are not projected: they are nil in every plan year,
      so plan pre-tax result and net profit leave out the actual year's net
      charge or release

# 2.3-2.6, 5.4, 6.5, 6.7. The sentences a refused request is answered with.
# code is stable; {placeholders} are rendered from the request the engine
# read and the pack values it checked against (TC-10).
request_refusals:
  unknown_driver: "{key} is not a driver this engine serves"
  op_not_allowed: "{op} is not an operation {key} accepts; it accepts {allowed}"
  shock_window: "shock {id}: {field} is {value}, outside {low} to {high} months"
  annual_alignment: >-
    shock {id}: {key} is set once per plan year, so a shock on it starts on
    the first month of a plan year, ends on the last month of one or not at
    all, and has no ramp
  growth_change_is_an_override: "a per-year growth change is sent as an override"
  growth_pp_source: "shock {id}: growth_pp comes only from a template or a preset"
  shock_source_unknown: "shock {id}: source {source} is not user, template:<id>, preset:<id> or breakeven:<metric>"
  overlapping_sets: "shocks {first} and {second} both set {key} in month {month}"
  duplicate_shock_id: "two shocks share the id {id}"
  reserved_shock_id: "shock id {id} uses a reserved prefix"
  override_not_settable: "{key} is moved through {set_via}, not through an override"
  override_length: "{key} takes {expected} value(s), got {got}"
  not_exact: "{key}: {value} is not exactly representable in {unit}"
  out_of_bounds: "{key}: {value} is outside {low} to {high}"
  unknown_pool: "this book serves no cost pool {pool}; it serves {served}"
  fixed_share_range: "a fixed share is a decimal from 0 to 1, got {value} for {pool}"
  elasticity_value: "volume elasticity is 0 or 1, got {value} for {pool}"
  debt_year: "debt schedule year {year} is outside the {total_years} plan year(s)"
  debt_duplicate_year: "two debt schedule rows name plan year {year}"
  debt_negative: "debt schedule year {year}: {field} is negative; draws and repayments are stated as positive amounts"
  not_served_in_this_build: "this is not served in this build"
  days_not_measured: >-
    {key} is not measured on this book, so a change in days has nothing to
    add to; set it instead
  rate_not_measured: >-
    {key} is not priced on this book, so a change in percentage points has
    nothing to add to; set it instead
  cost_split_refused: >-
    this book's operating costs could not be split into fixed and variable
    parts ({reason}), so a plan that moves growth, sales volume, input
    prices or inflation would treat every cost as fully variable and none
    as fixed, which flatters a downturn and leaves inflation reaching no
    cost. The plan is refused; pool levels and selling prices can still be
    moved
  scalar_window: >-
    shock {id}: {key} holds one value for the whole plan, so a shock on it
    starts in the first month, never ends and has no ramp
  revenue_absent: >-
    the assembled profit and loss carries no revenue line, so there is no
    revenue to project; an absent revenue is never read as nil

# 6.6. The runway sentences. {period} is the served label of the period the
# funding line first draws in.
runway:
  exact: "cash reaches the floor in {period}"
  annual_tail: >-
    cash stays above the floor for every modelled month; the first shortfall
    falls in {period}, whose month is not modelled
  none: "no shortfall within the horizon"
  facility_limit:
    code: "facility_limit_not_loaded"
    text: "facility limit not loaded"
# ── end plan/2 B5 ───────────────────────────────────────────────────────

# ── plan/2 B6: fp1.2 serving (contract 2.2, 1.4, 3.1, 3.6, 11, 12) ─────────
# latency: the client block of 3.1 and the in-process F9 budgets. Every
# number is data (TC-10): the page reads debounce values from the response,
# the latency gate reads its budgets and the body cap from here.
# body_cap_bytes was set from the measured B6 chart-profile body: the
# largest of the four corpus books at monthly_months 24 with two shocks was
# retail at 339,293 bytes; the cap is that, rounded up. The gate prints the
# measured size beside it.
latency:
  debounce_ms: 150
  analysis_debounce_ms: 600
  chart_inprocess_p50_ms: 1500
  body_cap_bytes: 400000
# 2.2: the plan length a request that omits total_years is compiled with.
scenarios:
  total_years: 2
  max_total_years: 5
  horizon_required:
    code: horizon_required
    text: a request states its horizon unless it replays a saved case
  total_years_range:
    code: total_years_out_of_range
    text: "total_years is a whole count from one to {max}; the request asked for {got}"
# 1.4: the month a period must end in for its flows to be read as a full
# year (base_period.flow_months); a period_start is not persisted.
history:
  fiscal_year_end_month: 12
  flow_span_not_stated:
    code: anchor_flow_span_not_stated
    text: >-
      the anchor's flow span is not stated; its flows are read as a full year
# 12: what a driver that moves no figure in this plan is served with. A key
# with its own sentence uses it; every other key the default, rendered with
# the driver's served label.
inert:
  default: >-
    moving {label} changes no figure in this plan
  revolver_rate: >-
    no funding draw in this plan, so the revolver rate charges nothing
  interest_rate_debt: >-
    this plan carries no debt balance, so the debt rate charges nothing
  interest_income_rate: >-
    no cash balance earns interest in this plan, so the rate earns nothing
# 3.6: FY aggregate formulas and the partial-serve sentence of an aggregate
# whose plan year is not fully served (6.5).
aggregates:
  flow_formula: sum of months
  balance_formula: closing month
  opening_formula: opening month
  cumulative_fcf_formula: sum of operating and investing cash over the served periods
  not_fully_served:
    code: plan_year_not_fully_served
    text: >-
      this plan year is served only up to the period the funding line could
      not be priced in, so its total is not served
# 3.9, 2.9: what a field or block whose batch has not landed is served as.
not_served:
  code: not_served_in_this_build
  text: this is not served in this build
# 3.6: the served figure order and each line's formula, in words. The order
# of this mapping IS the figure order; the loader refuses a line the engine
# does not project and an engine line this mapping omits.
lines:
  pl.revenue: prior revenue x (1 + revenue growth) x volume index x price index, sliced by days
  pl.cost_of_sales: fixed part held, variable part x volume index x input price index
  pl.operating_costs: sum over pools of (fixed part x inflation x pool level + variable part x volume)
  pl.other_operating_income: the annual amount in force, sliced by days
  pl.ebitda: revenue - cost of sales - operating costs + other operating income
  pl.depreciation: opening net fixed assets x depreciation rate x days / days basis
  pl.amortisation: opening net intangibles x depreciation rate x days / days basis
  pl.ebit: ebitda - depreciation - amortisation
  pl.interest_expense_debt: opening debt x debt rate x days / days basis
  pl.interest_expense_funding_line: opening funding line x revolver rate x days / days basis
  pl.interest_income: opening cash x interest income rate x days / days basis, else the annual amount in force
  pl.other_financial_income: the annual amount in force, sliced by days
  pl.other_financial_expense: the annual amount in force, sliced by days
  pl.pretax_result: ebit - interest expense + interest income + other financial income - other financial expense
  pl.income_tax: tax rate x year-to-date pre-tax result, less tax already charged this plan year
  pl.net_income: pre-tax result - income tax
  bs.cash: closing cash of the cash flow statement
  bs.ar: revenue x dso days / days basis, reached over the unwind window
  bs.inventory: cost of sales x dio days / days basis, reached over the unwind window
  bs.other_current_assets: held at the opening balance
  bs.ppe_net: opening + capital expenditure - depreciation
  bs.intangibles_net: opening + intangible additions - amortisation
  bs.investment_property: held at the opening balance
  bs.other_non_current_assets: held at the opening balance
  bs.ap: cost of sales x dpo days / days basis, reached over the unwind window
  bs.other_current_liabilities: held at the opening balance
  bs.st_debt: opening + scheduled draws - scheduled repayments
  bs.revolver: opening + funding line draw - funding line repayment
  bs.lt_debt: opening + scheduled draws - scheduled repayments
  bs.other_non_current_liabilities: held at the opening balance
  bs.equity_contributed: held at the opening balance
  bs.equity_reserves: held at the opening balance
  bs.equity_retained: opening + net income - dividends paid
  bs.equity_other: held at the opening balance
  bs_totals.assets: sum of every asset line
  bs_totals.current_assets: cash + receivables + inventory + other current assets
  bs_totals.current_liabilities: payables + other current liabilities + short-term debt + funding line
  bs_totals.equity: contributed + reserves + retained + other equity
  bs_totals.equity_plus_liabilities: sum of every equity and liability line
  cf.net_income: net income of the income statement
  cf.depreciation: depreciation added back
  cf.amortisation: amortisation added back
  cf.change_in_receivables: opening receivables - closing receivables
  cf.change_in_inventory: opening inventory - closing inventory
  cf.change_in_payables: closing payables - opening payables
  cf.cash_from_operating: net income + depreciation + amortisation + working-capital changes
  cf.capital_expenditure: revenue x capex share of revenue
  cf.intangible_additions: revenue x intangible additions share of revenue
  cf.cash_from_investing: capital expenditure + intangible additions
  cf.debt_drawdowns: scheduled draws of the plan year, placed by the debt timing convention
  cf.debt_repayments: scheduled repayments of the plan year, placed by the debt timing convention
  cf.dividends_paid: net income x dividend payout share, when positive
  cf.funding_line_movement: the draw that brings cash to the floor, or the repayment cash above it allows
  cf.cash_from_financing: drawdowns - repayments - dividends + funding line movement
  cf.net_change_in_cash: operating + investing + financing cash
  cf.opening_cash: closing cash of the prior period
  cf.closing_cash: opening cash + net change in cash
# ── end plan/2 B6 ───────────────────────────────────────────────────────

# ── forecast-scenarios-live: the SECTOR rung of revenue_growth (contract
# 3.3 sector evidence, 3.4 ladder: book -> sector -> macro -> convention) ──
# The rung reads ONE committed dataset, engine.benchmarks_ro
# (src/engine/data/ro_sector_benchmarks.json: Ministry of Finance annual
# filings on data.gov.ro, CC-BY-4.0), at the company's CAEN class and its
# own size band; the dataset's own law already refuses a median published on
# fewer peers than it declares, and min_n below is the forecast lane's floor
# on top of it. A sentence carries no numeral: every figure, year, count and
# code in it is rendered from the evidence the engine used (TC-10).
sector:
  min_n: 5
  ratio: revenue_growth
  statistic: median
  method: >-
    median of net turnover growth between the dataset's two filed years,
    filers of families UU and BL with a positive prior turnover, joined by
    company identifier
  sentence: >-
    no comparable book history is loaded, so revenue grows at the median
    net turnover growth of this company's sector: {sector} ({level}), size
    band {band}, {growth} over {n} filers, {prior_year} to {year} ({source})
  # The same figure OFFERED beside a higher rung (alternatives.sector, when
  # the book's own history won): it names the sector median and never claims
  # the book history is missing.
  offer_sentence: >-
    the median net turnover growth of this company's sector, offered beside
    this book's own history: {sector} ({level}), size band {band}, {growth}
    over {n} filers, {prior_year} to {year} ({source})
  absent:
    caen_absent: >-
      this workspace carries no CAEN code, so no sector can be looked up
    turnover_absent: >-
      this book reports no positive turnover, so no size band can be chosen
    sector_not_in_dataset: >-
      this company's CAEN class and division are not in the sourced sector
      dataset
    insufficient_peers: >-
      the sector cell holds too few filers to publish a median growth
    below_min_n: >-
      the sector median stands on fewer filers than this lane's floor
    ratio_not_in_dataset: >-
      the sourced sector dataset publishes no turnover growth for this cell
# ── end forecast-scenarios-live sector ──────────────────────────────────
