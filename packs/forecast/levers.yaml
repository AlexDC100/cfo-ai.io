# THE LEVER REGISTRY OF THE ONE FORECAST ENGINE (plan_contract_v2 3a).
#
# Pack data, never code (TC-10): every rule id, sentence, cutoff, step,
# bound and budget the projection and its surfaces use lives here and is
# read through src/engine/forecast/levers_pack.py. Each section is added
# by the batch that first reads it (contract 3a.4) and appended under that
# batch's anchor comment (contract 0.6); a key nothing reads is a red at
# closure (S8 pack-key liveness).
#
# Addresses: a rule id is written packs/forecast/levers.yaml#<section>.<key>
# and a served convention carries the id named by its convention_id.

schema_version: "forecast_levers/1"
pack_id: "forecast-levers"

# ── plan/2 B2: tax (contract 6.3, 3.5) ─────────────────────────────────
# The two model conventions that decide how income tax is charged. Both
# are conventions, not measurements: nothing in a single trial balance
# states when tax is charged within a year or whether a loss is carried.
# The sentences are served verbatim beside every tax figure (conventions,
# 3.5) and on the face of the projection (notes); they carry no numeral.
tax:
  accrued_year_to_date:
    convention_id: "tax_accrued_year_to_date"
    sentence: >-
      income tax accrues on the year-to-date pre-tax result of each plan
      year: a period is charged the tax on the result so far this year less
      the tax already charged earlier in the same year, so a loss period
      reverses tax charged before it and the year as a whole is charged the
      tax on the year's own result. Tax is settled in cash in the period it
      accrues; the tax payable balance is held at its opening amount, so
      the plan shows no tax-timing benefit.
  no_loss_carry_forward:
    convention_id: "tax_no_loss_carry_forward"
    sentence: >-
      a loss is not carried across plan years: a plan year whose pre-tax
      result is negative is charged no tax and shields no later year's
      profit. This is a model convention held until a sourced carry-forward
      rule is packed, not a statement of Romanian law.
# ── end plan/2 B2 ───────────────────────────────────────────────────────

# ── plan/2 B3: terminal rungs and default rules (contract 3.4, 3a.4) ────
# The last rung of each driver's default ladder, and the two rules B3
# stamps as conventions. A rung is pack data, never a code literal
# (TC-10): its value is a decimal string (parsed exactly, never through a
# float) and its sentence is served verbatim as the driver's basis. A
# sentence carries no numeral; where it names an amount measured from the
# book it writes the placeholder {amount}, which the engine renders from
# the integer it used. Addresses: packs/forecast/levers.yaml#<key>.<rung>.
revenue_growth:
  terminal_rung:
    value: "0"
    sentence: >-
      no comparable book history and no macro anchor for this jurisdiction,
      so revenue is held flat
dividend_payout_pct:
  # The book rung is never available: a trial balance closes the year, so
  # what was distributed during it is not a balance anything can read.
  book_rung_absent: >-
    distributions are not measurable from closing balances
  terminal_rung:
    value: "0"
    sentence: >-
      no declared distribution, so none is projected
intangible_additions_pct_of_revenue:
  terminal_rung:
    value: "0"
    sentence: >-
      no capitalised-intangible programme is observable in a trial balance
capex_pct_of_revenue:
  terminal_rung:
    value: "0"
    sentence_no_charge: >-
      this book names no charge to replace, so the projection spends
      nothing on capital
    sentence_nil_revenue: >-
      this book reports no revenue, so capital expenditure cannot be sized
      as a share of it; nothing is spent on capital, and the depreciation
      charge of {amount} runs the asset base down unreplaced
capex_maintenance_replaces_depreciation:
  sentence: >-
    maintenance-capital convention: capital expenditure replaces the
    depreciation charge of {amount}, carried as a share of revenue. A trial
    balance discloses no investment plan, so this is a convention, not a
    measurement of intent
interest_income_annual:
  terminal_rung:
    value: "0"
    sentence: >-
      this book names no interest income, so none is carried
other_financial_income_annual:
  terminal_rung:
    value: "0"
    sentence: >-
      this book names no financial income, so none is carried
other_financial_expense_annual:
  terminal_rung:
    value: "0"
    sentence: >-
      this book names no financial expense, so none is carried
other_operating_income_annual:
  # The held other operating income (5.5; plan/2 B4b renamed the key from
  # other_operating_income_pct_of_revenue to this one, contract 3.4).
  terminal_rung:
    value: "0"
    sentence: >-
      this book names no other operating income, so none is carried
min_cash:
  default_rule:
    value: "0"
    sentence: >-
      the cash floor below which the funding line draws; nil means the plan
      may run the account down to nothing but never below it
# ── end plan/2 B3 ───────────────────────────────────────────────────────

# ── plan/2 B4b: inflation, the neutral index rung and the pool templates
# (contract 3.4, 3a.2, 3a.4, 5) ─────────────────────────────────────────
# inflation moves the FIXED part of every operating-cost pool (5.3); its
# macro rung is the same ro_macro anchor revenue_growth takes, and this is
# the rung below it. index_neutral is the convention rung of every index
# driver (volume_index, price_index, input_price_index, pool_level.<pool>):
# the anchor level holds until a shock moves it. The two pool template
# entries are declared ONCE here and expanded per book by the engine over
# the pools packs/forecast/cost_behaviour.yaml serves (3a.2).
inflation:
  terminal_rung:
    value: "0"
    sentence: >-
      no macro anchor for this jurisdiction, so fixed costs are held at
      their book level
index_neutral:
  value: "1"
  sentence: >-
    no index move is assumed, so the anchor level holds
pools:
  templates:
    pool_fixed_share:
      unit: ratio
      expands_over: >-
        cost_of_sales first, then every served operating-cost pool in the
        cost-behaviour pack's order, unallocated_operating last (or the
        single operating_costs pool when the split refused)
    pool_level:
      unit: index
      expands_over: >-
        every served operating-cost pool, never cost_of_sales
# ── end plan/2 B4b ───────────────────────────────────────────────────────

# ── plan/2 B5: the driver registry, the working-capital unwind, debt
# timing, the unserved concepts and the request refusals (contract 2.3-2.6,
# 3a.1-3a.3, 6.2, 6.5, 6.7) ─────────────────────────────────────────────
# One entry per served driver key (3a.2), in served order. Every decimal is
# a string, parsed exactly and never through a float. bounds, tornado and
# probe_value are in the driver's own unit: a ratio as a decimal fraction,
# days in days, an index as a decimal multiplier, money in major units.
# solve_step is one model unit of the key (a micro, a micro-day, a minor
# unit). set_via says which request field may move the key: overrides (the
# cockpit), shocks_only, behaviour_overrides or not_settable. consumers are
# the lines the key moves DIRECTLY; the loader checks each against the
# engine's own attribution (LINE_ASSUMPTIONS) and refuses a line the key is
# not attributed to. The two pool entries are templates, expanded per book
# over the served pools (3a.2). breakeven metric ids are served from B6 and
# resolved by the batch that adds the metric registry (B8, B11).
registry:
  revenue_growth:
    model_key: revenue_growth
    pack_key: revenue_growth
    panel: growth
    rail_group: revenue
    unit: ratio
    shape: per_year
    granularity: annual
    bounds: {min: "-1", max: "3"}
    reach_step: "0.01"
    probe_value: "0"
    tornado: {low: "-0.10", high: "0.10"}
    breakeven: null
    allowed_ops: [set, add_pp, growth_pp]
    rail_op: null
    set_via: overrides
    favourable_direction: up
    case_rule: macro_band
    label_key: lever.revenue_growth
    consumers: [pl.revenue]
  volume_index:
    model_key: volume_index
    pack_key: null
    panel: growth
    rail_group: revenue
    unit: index
    shape: scalar
    granularity: monthly
    bounds: {min: "0", max: "3"}
    reach_step: "0.01"
    probe_value: "1"
    tornado: {low: "0.90", high: "1.10"}
