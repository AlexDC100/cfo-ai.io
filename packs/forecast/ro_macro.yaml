# MACRO ANCHORS — the ONLY numbers in the forecast that come from outside
# the company's own book.
#
# WHY THIS FILE IS SEPARATE FROM drivers.yaml
# -------------------------------------------
# Everything in drivers.yaml is a RULE about how to read the company. The
# values below are EXTERNAL FACTS about an economy. They age, they are
# owned by an institution that is not us, and they must be replaceable
# without touching a single rule. Keeping them in the driver pack would
# have made "8.2% because that is this company's CAGR" and "2.5% because
# a central bank says so" look like the same kind of number on the page.
#
# WHEN AN ANCHOR IS USED
# ----------------------
# ONLY when the workspace holds ONE actuals period, so the company's own
# rate of change cannot be measured at all. Two periods beat this file;
# three beat it decisively. Any driver defaulted from here is emitted with
# status `fallback` and a note naming this file, and the surface must show
# that note beside the number.
#
# WHY NOT ZERO
# ------------
# A one-period book does not tell us the company is flat. ABSENT != ZERO
# applies to a growth rate exactly as it applies to a balance: 0% growth
# is a claim about the future, and it is the wrong claim for a nominal
# projection in an economy with a positive inflation target, because it
# quietly assumes prices fall in real terms every year of the forecast.
#
# OPERATOR NOTE
# -------------
# `stated_as_of` is the date the value below was last confirmed against
# the source by a person. It is NOT read by any code and nothing expires
# on it; it exists so a reader can see how old the anchor is. Re-confirm
# before a lending pack goes out.

schema_version: "forecast_macro/1"
pack_id: "ro-macro"
pack_version: "1"
jurisdiction: "RO"
currency: "RON"

anchors:

  inflation:
    # plan/2 B3 (contract 3.3, 4): the id both engine.forecast and
    # engine.forecast_drivers cite for this series. One file, one loader
    # (engine.forecast.levers_pack.macro_pack), one id.
    series_id: "ro.bnr.inflation_target"
    label: "Inflation anchor"
    source_url: null
    value: 0.025
    band_half_width: 0.010
    source: "Banca Naţională a României — flat inflation target, 2.5% ±1pp"
    source_kind: "central bank policy target"
    stated_as_of: "2026-09-08"
    unit: rate
    why: >-
      The target, not a forecast print. A published policy target is the
      one macro number that is stable enough to sit under a 5-year
      projection and specific enough to defend to a credit committee, and
      its OWN ±1pp tolerance band is what the upside and downside cases
      are built from — so even the spread between the cases is a number
      someone else published rather than one we chose.
    used_for:
      - revenue_growth
      - opex_growth

# ── plan/2 B3: statutory rates (contract 3.3 macro kind statutory, 3.4 R16)
# A statutory rate is law, not a forecast print: it is the rung a driver
# takes when the book cannot measure its own effective rate, for a period
# whose jurisdiction is this pack's (the anchor envelope's
# pack_provenance.jurisdiction, contract 0.3). A jurisdiction with no
# packed record refuses the plan rather than assume one.
#
# OPERATOR NOTE: `value` was the literal 0.16 in
# src/engine/forecast/assumptions.py before B3 moved it here. `stated_as_of`
# records the day it was moved, NOT a fresh confirmation against the
# source; `source_url` is null (the chip then says "source link not
# recorded") until a person confirms both against the published code.
statutory:
  profit_tax_rate:
    series_id: "ro.codul_fiscal.profit_tax_rate"
    label: "Profit tax rate"
    value: 0.16
    source: "Codul fiscal, Legea 227/2015, art. 17"
    source_url: null
    stated_as_of: "2026-09-15"
    unit: rate
# ── end plan/2 B3 ───────────────────────────────────────────────────────

# ── forecast cockpit: DATED external series (forecast-scenarios-live) ────
# Published figures the Forecast cockpit prints beside a lever as its basis
# and builds the Optimist / Pesimist cases from (packs/forecast/cockpit.yaml).
# NOT anchors: no base driver defaults from them — the base forecast stays on
# the anchors above, so the base case IS the forecast (gate F4). Each point is
# a published number with the institution, the publication and the date it
# was published; `stated_as_of` is the day a person confirmed the points
# against the source. Values are decimal strings, read exactly. A point's
# `at` is the period the number describes (YYYY-MM), never the publication
# date.
#
# OPERATOR NOTE: re-confirm every point before a lending pack goes out; a
# series that has been superseded (a newer Inflation Report, a new minimum
# wage) is replaced here, never edited in place without its new date.
series:
  bnr_inflation_projection:
    series_id: "ro.bnr.raport_inflatie.2026_08"
    kind: "central bank projection"
    label: "BNR annual CPI inflation projection"
    source: "Banca Naţională a României — Raport asupra inflaţiei, august 2026"
    source_url: "https://www.bnr.ro/25729-raport-asupra-inflatiei-august-2026"
    published: "2026-08-13"
    stated_as_of: "2026-09-21"
    unit: rate
    points:
      - {at: "2026-12", value: "0.061"}
      - {at: "2027-12", value: "0.034"}
      - {at: "2028-06", value: "0.028"}
  ins_cpi_annual:
    series_id: "ro.ins.ipc.rata_anuala"
    kind: "official statistic"
    label: "INS annual CPI inflation rate"
    source: "Institutul Naţional de Statistică — Indicii preţurilor de consum, august 2026"
    source_url: "https://insse.ro/cms/ro/tags/comunicat-indicele-preturilor-de-consum"
    published: "2026-09-11"
    stated_as_of: "2026-09-21"
    unit: rate
    points:
      - {at: "2026-07", value: "0.0816"}
      - {at: "2026-08", value: "0.0617"}
  ins_ippi_manufacturing:
    series_id: "ro.ins.ippi.industria_prelucratoare.anual"
    kind: "official statistic"
    label: "INS industrial producer prices, manufacturing, year on year"
    source: "Institutul Naţional de Statistică — Indicii preţurilor producţiei industriale, iulie 2026 (industria prelucrătoare, iulie 2026 faţă de iulie 2025)"
    source_url: "https://insse.ro/cms/ro/tags/comunicat-ippi"
    published: "2026-09"
    stated_as_of: "2026-09-21"
    unit: rate
    points:
      - {at: "2026-07", value: "0.0965"}
  minimum_wage_gross:
    series_id: "ro.hg.salariul_minim_brut"
    kind: "statutory"
    label: "Gross national minimum wage, RON per month"
    source: "Hotărârea Guvernului aprobată la 12 martie 2026 — salariul de bază minim brut pe ţară garantat în plată (Ministerul Muncii, Familiei, Tineretului şi Solidarităţii Sociale)"
    source_url: "https://mmuncii.gov.ro/salariul-de-baza-minim-brut-pe-tara-garantat-in-plata-se-majoreaza/"
    published: "2026-03-12"
    stated_as_of: "2026-09-21"
    unit: ron_per_month
    points:
      - {at: "2025-01", value: "4050"}
      - {at: "2026-07", value: "4325"}
  bnr_lending_facility_rate:
    # The rate a credit line is priced at when the book itself cannot price
    # one (it carries no interest-bearing debt): the central bank's lending
    # facility, the rate at which it lends to banks overnight — a FLOOR under
    # what a bank charges a company, stated as such beside the figure.
    series_id: "ro.bnr.facilitatea_de_creditare"
    kind: "central bank rate"
    label: "BNR lending facility rate"
    source: "Banca Naţională a României — Hotărârea Consiliului de administraţie pe probleme de politică monetară din 8 iulie 2026 (facilitatea de creditare)"
    source_url: null
    published: "2026-07-08"
    stated_as_of: "2026-09-21"
    unit: rate
    points:
      - {at: "2026-07", value: "0.075"}
# ── end forecast cockpit series ─────────────────────────────────────────
