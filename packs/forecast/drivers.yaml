# THE FORECAST DRIVER PACK — pure data, no code.
#
# Every driver's identity, the AUTHORITY its default is read from, whether
# it is a LEVEL (a state, measurable from one period) or a RATE (a change,
# which needs at least two), and which way is upside.
#
# WHY THE CLASSIFICATION LIVES HERE AND NOT IN THE MODULE
# ------------------------------------------------------
# TC-10: no cutoff or rule is written as prose. Which expense leaves count
# as fixed, which authority a default is read from, and which drivers move
# between cases are all DATA below. The module reads this table; the
# rendered `basis` sentence beside every number is generated from the same
# table, so a reader who disagrees with a default can see the rule that
# produced it.
#
# THE ONE RULE ABOUT DEFAULTS
# ---------------------------
# A default with no stated basis is a number someone will later mistake
# for a fact. Every driver here names `authority` — the exact field of the
# served payload its default comes from — and the module refuses to emit a
# value it cannot attribute. `authority: none` means the served payload
# carries NO source for this driver: it is emitted ABSENT (value None),
# never 0. A company with no debt has no interest rate, and 0% is a
# different claim from "not measurable".
#
# HOW THE THREE CASES ARE DERIVED — READ `case_rule`
# --------------------------------------------------
# `case_rule: band_traverse`  the upside is the STRONG rung and the
#     downside is the WATCH rung of `statements.assembled_bands.bands`
#     — the SAME rungs the report's own verdict grades this company on.
#     No new number is invented: a downside case lands exactly on the
#     threshold at which the product already says "watch this". Clamped so
#     a case is never better than the actual on the downside or worse than
#     the actual on the upside.
# `case_rule: macro_band`     the upside/downside come from the published
#     tolerance band of the macro anchor in ro_macro.yaml (the central
#     bank's own ±band), not from a chosen percentage.
# `case_rule: hold`           the driver does NOT move between cases. A
#     case is a statement about TRADING CONDITIONS. Capex, headcount,
#     dividend policy, the tax rate and the contracted rate on existing
#     debt are management decisions and contracts — moving them by a
#     percentage would be a gesture, not a case, and it would make the
#     three sets incomparable because two things changed at once.
#
# When the company has 2+ periods the case rule is IGNORED for that driver
# and its own observed history is used instead (see `engine.forecast_
# drivers.cases`): the company's own best and worst beat any band.

schema_version: "forecast_drivers/1"
pack_id: "forecast-drivers"
pack_version: "1"

# Rounding is declared per unit so two runs on the same payload produce
# byte-identical output. Determinism is not a test-time nicety here: a
# saved assumption set is compared against a re-derived one to tell the
# user their actuals moved.
round_dp:
  rate: 6
  days: 4
  currency: 2
  count: 0
  years: 2

# The expense-nature split behind `opex_fixed_share`. plan/2 B4b (contract
# 4, 5.2): re-keyed to the PREFIX classification of the cost-behaviour pack
# — the engine's pool split over the anchor's line items is the one
# authority, and this package reads its amount-weighted share. The leaf
# lists that lived here are gone with the second derivation.
opex_nature_split:
  authority: "packs/forecast/cost_behaviour.yaml#nature"

# Gross depreciable base for `depreciation_rate`. Land is excluded because
# it is not depreciated; assets under construction are excluded because
# they are not yet in service. Canonical BS row ids.
depreciable_rows:
  - ppe_buildings
  - ppe_machinery_equipment
  - ppe_furniture_office
  - intangibles_other

# Interest-bearing debt for `interest_rate`. Canonical BS row ids.
debt_rows:
  - lt_debt_bank
  - lt_debt_other
  - st_debt_bank

# FX exposure is "material" — and `fx_rate_move` therefore emitted rather
# than left absent — when FX cash plus realised FX result reaches this
# share of revenue. Below it, the driver is ABSENT: a forecast that models
# an immaterial exposure invites a reader to weight it.
fx_materiality_of_revenue: 0.02

drivers:

  - key: revenue_growth
    label: "Revenue growth"
    unit: rate
    kind: rate
    favourable_direction: up
    authority: "assembled_pl.revenue"
    case_rule: macro_band
    macro_anchor: inflation
    why: >-
      The top line of the projection. With two or more periods this is the
      company's own compound growth; with one it is the inflation anchor,
      which is a nominal continuation at constant real volume and is
      labelled as such.

  - key: gross_margin
    label: "Gross margin"
    unit: rate
    kind: level
    favourable_direction: up
    authority: "line_items.cogs (the engine.forecast cost_of_sales pool base) ÷ assembled_pl.revenue — read as pools.cost_of_sales_share (plan/2 B4b)"
    band_key: gross_margin
    case_rule: band_traverse
    why: >-
      One minus the cost-of-sales share engine.forecast projects with
      (plan/2 contract 4: one concept, one value). It was read from the
      methodology ratio, which disagreed with the projection's cost share
      on three of the four committed books; a margin and the cost
      structure the plan spends must be one statement about the company.

  - key: opex_growth
    label: "Operating cost growth"
    unit: rate
    kind: rate
    favourable_direction: neutral
    authority: "assembled_pl.opex_excluding_cogs_and_da"
    case_rule: hold
    macro_anchor: inflation
    why: >-
      Held at the inflation anchor across all three cases. Applying the
      SAME band to revenue and to costs in opposite directions would
      assume low price inflation on what the company sells and high
      inflation on what it buys, from one central-bank number.

  - key: opex_rate
    label: "Operating cost ÷ revenue"
    unit: rate
    kind: level
    favourable_direction: down
    authority: "line_items.operatingExpenses (the engine.forecast operating-cost pools, summed) ÷ assembled_pl.revenue — read as pools.operating_cost_share (plan/2 B4b)"
    case_rule: hold
    why: >-
      Read from engine.forecast, which owns the derivation (plan/2 contract
      4). The LEVEL that `opex_growth` is a change in. A projection needs
      both: the share of revenue the operating base consumes today, and
      the rate at which it moves. Without this driver the level is
      re-measured by whoever projects, from whichever cost field they
      pick, and one company acquires two operating-cost structures.
      Held across the three cases for the same reason `opex_growth` is:
      the operating-leverage response to a revenue case is carried by
      `opex_fixed_share`, and moving the level as well would count the
      same effect twice.

  - key: opex_fixed_share
    label: "Fixed share of operating cost"
    unit: rate
    kind: level
    favourable_direction: neutral
    authority: "engine.forecast pools (packs/forecast/cost_behaviour.yaml#nature)"
    case_rule: hold
    why: >-
      The operating-leverage lever: it is what makes a downside case bite
      harder than the revenue fall alone. Split by expense NATURE from
      this book's own leaves, because a regression split needs 3+ periods.

  - key: personnel_rate
    label: "Personnel cost ÷ revenue"
    unit: rate
    kind: level
    favourable_direction: neutral
    authority: "envelope.aggregates.personnel_total"
    case_rule: hold
    why: >-
      The runnable form of the headcount driver. A trial balance carries
      the personnel COST but never the headcount, so the cost ratio is
      what can be defaulted; headcount and average cost stay absent until
      a person supplies the number.

  - key: headcount
    label: "Headcount"
    unit: count
    kind: level
    favourable_direction: neutral
    authority: none
    case_rule: hold
    why: >-
      No trial balance carries an employee count. Absent, not zero, and
      not inferred by dividing by a guessed average wage.

  - key: avg_personnel_cost
    label: "Average cost per employee"
    unit: currency
    kind: level
    favourable_direction: neutral
    authority: "derived: personnel_total ÷ headcount"
    case_rule: hold
    why: >-
      Computable the moment headcount is supplied, and absent until then.

  - key: dso
    label: "Days sales outstanding"
    unit: days
    kind: level
    favourable_direction: down
    authority: "canonical_bs.rows.trade_receivables_net ÷ assembled_pl.revenue (engine.forecast forecast.dso)"
    band_key: dso
    case_rule: band_traverse
    why: >-
      Read from engine.forecast's formula forecast.dso (plan/2 contract 4):
      the days the projection actually spends, to the micro-day, so a
      second DSO cannot exist beside the one the plan uses.

  - key: dio
    label: "Days inventory outstanding, in days of cost of sales"
    unit: days
    kind: level
    favourable_direction: down
    authority: "canonical_bs.rows.inventory_net ÷ assembled_pl.cogs (engine.forecast forecast.dio_cogs)"
    band_key: dio
    case_rule: band_traverse
    why: >-
      Read from engine.forecast's formula forecast.dio_cogs (plan/2 contract
      4, R8): inventory over COST OF SALES. The ratio table divides by total
      operating expense, so the engine's basis quotes that value beside this
      one rather than serving two numbers under one name. A book with no
      cost of sales has no DIO, and so no driver.

  - key: dpo
    label: "Days payable outstanding, in days of cost of sales"
    unit: days
    kind: level
    favourable_direction: up
    authority: "canonical_bs.rows.trade_payables ÷ assembled_pl.cogs (engine.forecast forecast.dpo_cogs)"
    band_key: dpo
    case_rule: band_traverse
    why: >-
      As DIO, over cost of sales (forecast.dpo_cogs). Higher is favourable,
      so the upside and downside rungs are read off the band in the
      opposite direction to DSO and DIO.

  - key: capex_rate
    label: "Capex ÷ revenue"
    unit: rate
    kind: level
    favourable_direction: neutral
    authority: "assembled_pl.depreciation ÷ assembled_pl.revenue (engine.forecast capex_maintenance_replaces_depreciation)"
    case_rule: hold
    forced_status: fallback
    why: >-
      Read from engine.forecast, whose maintenance-capital convention
      (depreciation over revenue) owns the concept since plan/2 B3
      (contract 4). The earlier reading follows, and still holds for why
      the number is a convention and not a measurement:
      The engine publishes capex intensity as an explicit PROXY (D&A as a
      share of revenue) and says so in its own note, because real capex
      needs a period-over-period PP&E delta. That note is carried onto
      this driver verbatim rather than dropped, and the driver is marked
      a fallback even though a number is available. The cash-flow
      statement's `capex_total` is NOT used: it is produced by the
      approximation path that stamps `is_approximated: true`, and reading
      it would launder an approximation into a default.

  - key: depreciation_share_of_gross_depreciable_base
    label: "Depreciation charge over gross depreciable assets"
    unit: rate
    kind: level
    favourable_direction: neutral
    authority: "assembled_pl.depreciation ÷ canonical_bs rows (depreciable_rows)"
    case_rule: hold
    why: >-
      Renamed from depreciation_rate in plan/2 B3 (contract 4, R17): the
      charge this book booked over the GROSS cost of its depreciable assets,
      land and construction excluded — the policy rate an accountant
      states. It is a different quantity from the run-off rate the
      projection spends (depreciation_rate, below), so it keeps its own
      name and never crosses to the model.

  - key: depreciation_rate
    label: "Depreciation rate on closing net book value"
    unit: rate
    kind: level
    favourable_direction: neutral
    authority: "assembled_pl.depreciation ÷ canonical_bs.rows.ppe_net + intangibles_net (engine.forecast depreciation_rate)"
    case_rule: hold
    why: >-
      Read from engine.forecast, the authority (plan/2 contract 4, R17): the
      anchor's charge over its closing net book value, the one rate that
      reproduces the anchor's own charge in plan year one. Loading history
      never changes this denominator.

  - key: new_debt
    label: "New borrowing per year"
    unit: currency
    kind: level
    favourable_direction: neutral
    authority: none
    case_rule: hold
    why: >-
      A plan, not a fact. Nothing in a closing trial balance says what the
      company intends to draw next year, and defaulting it from last
      year's drawdowns would present a financing plan as a measurement.

  - key: debt_repayment_years
    label: "Amortisation tenor of existing debt"
    unit: years
    kind: level
    favourable_direction: neutral
    authority: "engine assumption (dscr_approx note)"
    case_rule: hold
    forced_status: fallback
    # Last-resort only. The tenor is READ from the served DSCR note; this
    # value is used ONLY when a book's note declares none, and the driver
    # then labels itself the pack's tenor rather than the engine's. A
    # second copy of a number that claims to BE the engine's would go on
    # claiming it after the engine changed its own.
    fallback_value: 8.0
    why: >-
      A trial balance carries the debt BALANCE but never its maturity
      schedule. The engine's own DSCR already amortises long-term debt
      over a stated tenor, and that tenor is READ from the served
      dscr_approx note rather than restated here, so two surfaces of one
      report cannot disagree about it. Marked a fallback because it is an
      assumption in both places.

  - key: interest_rate
    label: "Effective interest rate on debt"
    unit: rate
    kind: level
    favourable_direction: down
    authority: "assembled_pl.interest_expense ÷ canonical_bs.rows.financial_liabilities (engine.forecast interest_rate_debt)"
    case_rule: hold
    why: >-
      What this company actually pays. Held across cases because the rate
      on drawn debt is contracted, not a trading condition. Computed on
      the CLOSING balance, which overstates the rate when debt grew during
      the year; the note says so whenever no prior period is available to
      average against.

  - key: tax_rate
    label: "Effective tax rate"
    unit: rate
    kind: level
    favourable_direction: down
    authority: "assembled_pl.income_tax ÷ assembled_pl.pretax"
    case_rule: hold
    why: >-
      The EFFECTIVE rate this book paid, not the statutory headline. The
      two differ for every Romanian company with a micro-enterprise
      history, non-deductibles or a sponsorship credit, and the effective
      rate is the one that projects. Measured only when BOTH are true: a
      class-69 account (691 impozit pe profit / 698) stands behind the
      charge, and this book's pre-tax result less that charge IS the
      profit it filed in account 121, to the cent. The filed profit is
      read from the account's own closing balance in
      canonical_bs.invariants.p121_cross_check.p121, never from
      assembled_pl.net_income_unexplained_vs_121 — the assembly sets that
      field to 0.00 whenever its anchor override did not fire, and again
      when no account-121 row survived extraction, so its zero is not a
      measurement. A book carrying no class-69 account reports income_tax
      0.00 as the sum of an empty set; a book whose build-up does not
      reproduce its filed profit would have its rate measured across that
      distance. Capitalised own work and the inventory variation are
      named where they bridge the two and do not rescue the rate: both
      sit inside the result the charge was assessed on and outside the
      pre-tax figure this rate divides by. Either way the driver is
      ABSENT and a consumer states the statutory rate under its own name.
      On all four committed books this refuses.

  - key: dividend_payout
    label: "Dividend payout ratio"
    unit: rate
    kind: level
    favourable_direction: neutral
    authority: "packs/forecast/levers.yaml#dividend_payout_pct (engine.forecast)"
    case_rule: hold
    why: >-
      Absent from every book (plan/2 contract 3.4): distributions are not
      measurable from closing balances, so the book rung is refused with the
      engine's sentence and the model states its convention rung under its
      own name. A 457 or 129 balance was read as a declared distribution
      before B3; a closing dividends-payable balance is what was not yet
      paid, not the year's payout, and the cash-flow statement's
      `dividends_paid` is an inference from typical Romanian payout ratios.

  - key: fx_rate_move
    label: "FX move on exposed balances"
    unit: rate
    kind: rate
    favourable_direction: neutral
    authority: "canonical_bs cash_fx + assembled_pl fx_gain/fx_loss"
    case_rule: hold
    why: >-
      Emitted only when the exposure reaches the materiality share above.
      Below it the driver is absent, so a reader is never invited to
      weight an FX line that does not move this company's result.
