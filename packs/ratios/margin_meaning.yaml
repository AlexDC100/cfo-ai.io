# WHEN A MARGIN IS NOT MEANINGFUL — one rule, pure data (TC-10).
#
# Read by src/engine/ratios/margin_meaning.py and by nothing else. Every
# surface that prints a margin over turnover asks that module first: the
# ratio table's margin rows (engine.ratios.table), the served period
# (GET /api/period -> statements.margin_meaning, served where the rule
# refuses and read by the dashboard),
# and the forecast cockpit's four numbers, its sentence and the bank
# export built from them (engine.forecast.cockpit). A threshold stated here
# is rendered from here wherever it is printed; no surface writes it as prose.
#
# WHY
# ---
# A margin divides a result by turnover (cifra de afaceri, class 70). It
# describes a company's sales only when turnover is a real part of what the
# company does. A property developer in a building year books its
# construction cost through class 6 and capitalises it into stock through
# account 711; its turnover is a little rent. On the corpus developer
# (saga_10_col_realestate) the served EBITDA margin was -17,884.9% and the
# forecast printed -17,886.1% for its final plan year: arithmetic on an
# incidental line, not a margin. Printed, it reads as a verdict on the
# company. It is refused instead, with the reason.
#
# THE RULE
# --------
# A margin over turnover is NOT MEANINGFUL when turnover is non-zero and
#
#     |turnover| < max(floor, share_below x activity)
#
#   activity  = total operating expense: cost of sales + operating expenses
#               + depreciation — assembled_pl.total_operating_expense on a
#               served period (the same figure the ratio table divides DIO
#               and DPO by), and cost of sales + operating costs +
#               depreciation + amortisation on a projected plan year. It is
#               measured identically on the actual year and on every
#               projected year. It does NOT move with the 711 ruling
#               (2026-09-26): the stock variation is inside EBITDA, not
#               inside this cost base, so the developer (turnover 0.6% of
#               activity) stays refused while its EBITDA turns positive.
#   turnover  = assembled_pl.revenue (net turnover, 709 netted) on a served
#               period; pl.revenue on a projected plan year.
#   floor     = in the book's own currency units: a percentage over less
#               than one unit of currency is not a margin.
#
# A turnover of exactly zero is outside the rule: every margin is already
# undefined there (a zero denominator), and that refusal stands as it was.
#
# MEASURED (2026-09-26), turnover / total operating expense on every corpus
# book that carries turnover, through the real write path and the real
# GET /api/period:
#
#   saga_10_col_carniprod    0.9989   (the lowest normal book)
#   saga_10_col_retail       1.0008
#   saga_10_col              1.0478
#   saga_10_col_agras        1.0719
#   pdf_positional           1.0843
#   saga_compact_6_col       2.6667   (synthetic)
#   saga_10_col_realestate   0.0055   (the developer)
#
# Every other corpus book carries no turnover, so the rule does not apply to
# it. share_below 0.10 sits almost ten times below the lowest normal book and
# eighteen times above the developer; at the threshold an EBITDA margin is
# about -900%, beyond which a percentage stops describing sales and starts
# describing the cost base. tests/engine/test_margin_meaning.py holds every
# corpus book to this table.
schema_version: "margin_meaning/1"

rule:
  activity: total_operating_expense
  share_below: "0.10"
  floor: "1"
  # The ratio-table keys that are a result divided by turnover. Every one of
  # them refuses together: one rule, one verdict per period (or plan year).
  applies_to: [gross_margin, operating_margin, ebitda_margin, core_ebitda_margin, net_margin]

# What a refused margin prints, in place of a percent. {share} is
# |turnover| / activity as a percent; {floor} is the floor in the book's
# currency; {threshold} is share_below as a percent.
display:
  share:
    ro: "marjă nesemnificativă: cifra de afaceri este {share} din activitate"
    en: "margin not meaningful: turnover is {share} of activity"
  floor:
    ro: "marjă nesemnificativă: cifra de afaceri este sub {floor}"
    en: "margin not meaningful: turnover is below {floor}"
  basis:
    ro: "activitatea = cheltuielile de exploatare (costul vânzărilor, celelalte cheltuieli de exploatare și amortizarea); o marjă se calculează numai când cifra de afaceri este cel puțin {threshold} din activitate"
    en: "activity = operating expenses (cost of sales, the other operating expenses and depreciation); a margin is computed only when turnover is at least {threshold} of activity"

# ── the one note, for one case ──────────────────────────────────────────
# Served beside the EBITDA a property developer's margins were refused on.
# Since the owner's ruling of 2026-09-26 EBITDA INCLUDES the stock variation
# (account 711, "Variația stocurilor de produse", with its sign) — for a
# developer, the construction cost the book capitalised into stock. The note
# says so and quotes that component: assembled_pl.inventory_variation.value,
# the MEASURED net 711 (never the gross 711 credit turnover, which on a closed
# book is the production stocked, not the variation). Only when ALL of
# `requires` hold — the margin refused by the rule above, the account mix read
# as real estate by engine.industry (the family GET /api/period serves as
# industry_signal), and a positive net 711. A refused net 711 serves no note.
# (Until the ruling this note said the opposite — "the EBITDA above does not
# include them" — and quoted ebitda_statutory_with_711.)
note:
  id: capitalized_construction_711
  requires:
    margin: not_meaningful
    industry_family: real_estate
    inventory_variation: positive
  figure: assembled_pl.inventory_variation.value
  # Under the ACTUAL year's EBITDA (the dashboard, the report): that EBITDA
  # includes the figure.
  ro: "Pentru un dezvoltator imobiliar, costurile de construcție capitalizate în stocuri trec prin contul 711 (Variația stocurilor de produse): EBITDA de mai sus le include — {amount}."
  en: "For a property developer, construction costs capitalised into inventory run through account 711 (Variația stocurilor de produse): the EBITDA above includes them — {amount}."
  # Under a PLAN year's EBITDA (the forecast cockpit's final plan year and
  # the bank export). Plan years project net 711 at 0 (design A6), so the
  # EBITDA above does NOT include the figure: the note names the actual year
  # it belongs to and says the plan years carry none. (Until 2026-09-27 the
  # cockpit printed the actual-year sentence here — "the EBITDA above
  # includes them — RON 29.6M in 2025." — under an FY2030 EBITDA that
  # projects 711 at 0, on the card whose year-0 step says so.)
  plan_year:
    ro: "Pentru un dezvoltator imobiliar, costurile de construcție capitalizate în stocuri trec prin contul 711 (Variația stocurilor de produse): EBITDA din {year} le-a inclus — {amount}; anii de plan proiectează variația stocurilor la 0, deci EBITDA de mai sus nu le include."
    en: "For a property developer, construction costs capitalised into inventory run through account 711 (Variația stocurilor de produse): the {year} EBITDA included them — {amount}; the plan years project the stock variation at 0, so the EBITDA above does not include them."

# How the note's amount prints: one decimal, in the unit of the EBITDA the
# note stands under (millions when that EBITDA is a million or more, else
# thousands), so the headline and the stock variation read side by side
# ("0,6 mil. lei" above, "29,6 mil. lei" in the note). The strings are the
# cockpit's own money display (packs/forecast/cockpit.yaml#money_display),
# held equal by tests/engine/test_margin_meaning.py.
money_display:
  million: {ro: "{value} mil. lei", en: "RON {value}M"}
  thousand: {ro: "{value} mii lei", en: "RON {value}k"}
