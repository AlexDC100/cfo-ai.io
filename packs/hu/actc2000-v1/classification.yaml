prompt_guidance:
  header: "HUNGARIAN CHART LOGIC (számlatükör, Act C of 2000). The FIRST DIGIT of each account code names its class:"
  class_map:
    - digit: "0"
      name: "Nyilvántartási számlák"
      guidance: "off-balance memo accounts — exclude from the statement"
    - digit: "1"
      name: "Befektetett eszközök"
      guidance: "non-current assets: intangibles (11x), property/plant/equipment (12x-14x incl. accumulated depreciation on 129/139/149 credit side), investments in progress (16x), long-term financial assets (17x-19x)"
    - digit: "2"
      name: "Készletek"
      guidance: "inventories: raw materials (21x-22x), work in progress (23x), finished goods (25x), goods for resale (26x-28x), advances on inventories ((26)8x/28x per chart)"
    - digit: "3"
      name: "Követelések, pénzügyi eszközök és aktív időbeli elhatárolások"
      guidance: "current assets: trade receivables (31x), receivables from employees/other (36x), securities (37x), CASH AND BANK (38x: 381 pénztár = petty cash, 384 elszámolási betétszámla = bank account), deferred/accrued assets (39x). 368/466 VAT recoverable is an asset-side tax receivable."
    - digit: "4"
      name: "Források"
      guidance: "equity and liabilities: equity (41x: 411 jegyzett tőke = share capital, 412 tőketartalék = share premium, 413 eredménytartalék = retained earnings, 414 lekötött tartalék, 417/419 mérleg szerinti / adózott eredmény = current-year result), provisions (42x), subordinated + long-term liabilities (43x-44x), trade payables (454-455 szállítók), other short-term liabilities (46x-47x incl. 467 fizetendő áfa = VAT payable, 462 personnel, 463-464 tax authorities), passive accruals (48x), and 49x technical opening/closing accounts (491 nyitómérleg számla — CONTROL, exclude from the statement)."
    - digit: "5"
      name: "Költségnemek"
      guidance: "costs by nature (P&L expense side in a pre-closing TB): material costs (51x), services (52x-53x), payroll (54x), social contributions (56x), depreciation (57x), capitalized own performance offsets (58x), cost reallocations (59x)"
    - digit: "6"
      name: "Költséghelyek (opcionális)"
      guidance: "OPTIONAL management-accounting cost centres — technical mirror of class 5; normally excluded as control accounts"
    - digit: "7"
      name: "Költségviselők (opcionális)"
      guidance: "OPTIONAL management-accounting cost bearers — technical mirror of class 5; normally excluded as control accounts"
    - digit: "8"
      name: "Ráfordítások"
      guidance: "expenses: cost of goods sold / own performance (81x-83x when the entity books by cost-of-sales method), other expenses (86x), financial expenses (87x), extraordinary/tax items (88x-89x incl. 891 társasági adó = income tax)"
    - digit: "9"
      name: "Bevételek"
      guidance: "revenues: net sales domestic/export (91x-92x), other operating income (96x), financial income (97x), extraordinary income (98x)"
  footer: "Classes 6/7 (management accounting), 49x opening/closing and class 0 memo accounts must be classified as `excluded_control`."
