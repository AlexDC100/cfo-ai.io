  # ── FLIP-CARRIER rules synthesized from flip entries finer than
  # the rule table (BIFUNCTIONAL_WRONG_SIDE_FLIPS + the parser-layer
  # SIDE_FLIP_TO_LIAB_PREFIXES; see scripts/port_ro_pack.py).
  # line_id is EXACTLY what the in-code shorter catchall produces, so
  # classification is unchanged; only the side_flip is carried here.
  - rule_id: "ro.512.flip-carrier"
    prefix: "512"
    line_id: "cash"
    side_flip: {side: "credit", line_id: "stDebt"}
    description: "Flip-carrier for BIFUNCTIONAL_WRONG_SIDE_FLIPS (512 -> stDebt): codes 512x classify as cash via the in-code '51' catchall; a closing balance on the credit side re-routes to stDebt."
  - rule_id: "ro.1687.flip-carrier"
    prefix: "1687"
    line_id: "ltDebt"
    side_flip: {side: "credit", line_id: "otherCurrentLiab"}
    description: "Flip-carrier for SIDE_FLIP_TO_LIAB_PREFIXES (1687 -> otherCurrentLiab): codes 1687x classify as ltDebt via the in-code '168' catchall; a closing balance on the credit side re-routes to otherCurrentLiab."
