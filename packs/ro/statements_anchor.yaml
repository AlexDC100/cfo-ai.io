# THE ACCOUNT-121 ANCHOR PACK — pure data, no code (plan/2 B4a, contract 5.1).
#
# Account 121 ("profit si pierdere") is the filed net result; the assembled
# P&L rebuilds it from every class-6/7 row. The distance between the two is
# the one independent witness that the statement buckets read every row
# with the right sign. This pack holds the ONLY numbers the anchor-gap gate
# (tests/engine/test_statements_anchor_gap.py, battery gate
# statements-anchor-gap) is allowed to judge with (TC-10: the floor renders
# from this data and the book, never from a code literal).
#
# WHY THE FLOOR IS PER BOOK
# -------------------------
# Exporters that close class 6/7 into 121 print each P&L row's cumulative
# value on BOTH turnover sides ("mirrored"). For the production-variation
# accounts (711/712) that hides the NET of the year — a mirrored 711 prints
# its gross stocking turnover on each side and the destocking against it is
# invisible — so the reconstruction, which routes 711 to a memo, can miss
# 121 by at most that turnover. The floor for a book is therefore
# `cent_tolerance` plus the turnover of its rows under `hidden_net_prefixes`.
# On a book with no such rows (retail) the floor is one cent: the
# reconstruction must reproduce 121 exactly.
#
# SINCE THE ONE-EBITDA RULING (owner, 2026-09-26) the statement NAMES net
# 711 ("Variația stocurilor de produse") instead of routing it to a memo,
# and on a closed book that line is the account-121 bridge — derived from
# the very step this pack bounds. The gate therefore judges the step
# BEFORE the fold (account 121 − build-up − net 72x), never the served
# remainder (0.00 on a bridge book by construction), and holds the fold
# itself: bridge → 711 = the step; no 711 postings → 711 = 0.00 and the
# step stays a visible remainder. The floor below is the SAME law as the
# engine's guard G5 (|step| ≤ 711 activity, stock_variation.decide): a
# book beyond it is refused by the engine and red here.
schema_version: "statements_anchor/1"
pack_id: "ro-statements-anchor"
anchor_gap:
  # Half-up rounding of two-decimal cents can leave one cent between two
  # sums of the same rows; anything above it is a real row read wrongly.
  cent_tolerance: "0.01"
  # Account prefixes whose year net a mirrored exporter hides behind gross
  # turnover on both sides. Longest prefix wins; one entry per family.
  hidden_net_prefixes: ["711", "712"]
  # plan/2 B4 repair (B4V-7a): the gross 711/712 turnover is a FALLBACK
  # floor, roughly a hundred times the defect it was written for. What the
  # hidden net can actually be is the year's movement in production stock
  # (opening to closing balance of the accounts below); the gate prints
  # that movement and the residual beyond it for every book that carries
  # them. The residual is NOT judged yet: on agras and carniprod it is not
  # explained by production stock, and the cause is owed before a batch
  # builds on those books (as-built B4R).
  production_stock_prefixes: ["33", "34", "35"]
  sentence_fallback_floor: >-
    fallback floor: the gross production-variation turnover bounds the gap but
    does not explain it; the production stock movement and the residual beyond
    it are printed beside it and the residual is not yet judged
  sentence_within: >-
    the build-up reaches account 121 within what the production-variation
    turnover of this book can hide (the step the statement names as net 711)
  sentence_beyond: >-
    the build-up misses account 121 by more than the production-variation
    turnover of this book can hide, so a class-6/7 row entered a statement
    bucket with the wrong sign (the engine refuses net 711 on it: guard G5)
