# CFO AI — Generic Default Thresholds
#
# These are industry-neutral defaults a fresh tenant can start from. Real
# deployments override values in `config/tenants/<tenant>.yaml`. The legacy
# top-level `config.yaml` is loaded as a fallback until tenant routing lands.
#
# Edit defaults rarely. Most calibration belongs in tenant configs.

# ──────────────────────────────────────────────────────────────
# Financial parameters
# ──────────────────────────────────────────────────────────────
cost_of_capital_pct: 8.0       # Conservative default; CFOs override per their treasury rate
fx_eur_ron: 4.97               # Reference rate; override via env if live FX is available

# ──────────────────────────────────────────────────────────────
# Anchor (Protect) classification
# ──────────────────────────────────────────────────────────────
anchor:
  top_pct_by_absolute_profit: 20
  min_revenue_share_pct: 5.0
  volume_threshold_tons_default: 50
  floor_real_margin_pct: -2.0
  high_volume_anchor_floor_pct: 5.0

# ──────────────────────────────────────────────────────────────
# Liquidation rules (non-anchor only)
# ──────────────────────────────────────────────────────────────
eliminate:
  micro_volume_tons: 5
  micro_profit_kron: 5
  dio_capital_trap: 150
  capital_trap_real_margin: 5.0
  zero_sales_window_days: 60
  ccc_category_red_days: 120

# ──────────────────────────────────────────────────────────────
# Watch / Fix rules (non-anchor only)
# ──────────────────────────────────────────────────────────────
warning:
  thin_real_margin_max_pct: 3.0
  long_dio_days: 100
  trend_lookback_months: 3
  min_volume_tons: 5
  max_volume_tons: 150
  min_profit_kron: 0

# ──────────────────────────────────────────────────────────────
# Scale rules (non-anchor only)
# ──────────────────────────────────────────────────────────────
scale:
  high_margin_min_pct: 10.0
  high_margin_min_volume: 30
  volume_play_min_pct: 5.0
  volume_play_min_volume: 100
  gmroii_min_pct: 150
  high_volume_dio_max: 45

# ──────────────────────────────────────────────────────────────
# Computation windows
# ──────────────────────────────────────────────────────────────
windows:
  dio_rolling_days: 90
  trend_lookback_days: 90
  yoy_lookback_days: 365

# ──────────────────────────────────────────────────────────────
# Output
# ──────────────────────────────────────────────────────────────
output:
  default_path: "./output"
  json_filename_pattern: "daily_decisions_{date}.json"
  briefing_languages: ["en"]
