# SKU Decision Engine — Configuration
# Calibrated against YTD Oct 2025 Scandia trading data.
# All thresholds live here. NEVER hardcode in Python.

# ──────────────────────────────────────────────────────────────
# Financial parameters
# ──────────────────────────────────────────────────────────────
cost_of_capital_pct: 6.5    # Confirmed with Scandia treasury, RO 2026
fx_eur_ron: 4.97            # Reference rate. Override via env if live FX is available.

# ──────────────────────────────────────────────────────────────
# Anchor classification
# ──────────────────────────────────────────────────────────────
anchor:
  top_pct_by_absolute_profit: 20         # Top 20% per category are anchors
  min_revenue_share_pct: 5.0             # Or contributes >5% of division profit
  volume_threshold_tons_default: 50      # Per-month volume floor
  floor_real_margin_pct: -2.0            # Below this, anchor alert fires (absolute floor)
  high_volume_anchor_floor_pct: 5.0      # NEW: high-volume anchors must clear 5% real margin
                                         # (Macrou case: 353t but real margin 3.3% → alert)

# ──────────────────────────────────────────────────────────────
# Elimination rules (non-anchor only)
# ──────────────────────────────────────────────────────────────
eliminate:
  micro_volume_tons: 5                   # Sub 5t volume
  micro_profit_kron: 5                   # AND sub 5 kRON profit absolute
                                         # (Calamar/Pastrav/Plachie case)
  dio_capital_trap: 150                  # DIO > 150 days
  capital_trap_real_margin: 5.0          # AND real margin < 5%
  zero_sales_window_days: 60             # Dead stock detection window
  ccc_category_red_days: 120             # Category-level CCC threshold

# ──────────────────────────────────────────────────────────────
# Warning rules (non-anchor only)
# ──────────────────────────────────────────────────────────────
warning:
  thin_real_margin_max_pct: 3.0          # Real margin < 3% (MURATURI case: 0.1%)
  long_dio_days: 100                     # DIO > 100 (COMPOT/JELEURI case: 180)
  trend_lookback_months: 3

# ──────────────────────────────────────────────────────────────
# Scale rules (non-anchor only)
# ──────────────────────────────────────────────────────────────
scale:
  high_margin_min_pct: 10.0              # Premium plays
  high_margin_min_volume: 30
  volume_play_min_pct: 5.0               # SUC case: 205t @ 9.3%
  volume_play_min_volume: 100
  gmroii_min_pct: 150
  high_volume_dio_max: 45

# ──────────────────────────────────────────────────────────────
# Computation windows
# ──────────────────────────────────────────────────────────────
windows:
  dio_rolling_days: 90
  trend_lookback_days: 90
  yoy_lookback_days: 365

# ──────────────────────────────────────────────────────────────
# Output
# ──────────────────────────────────────────────────────────────
output:
  default_path: "./output"
  json_filename_pattern: "daily_decisions_{date}.json"
  briefing_languages: ["ro", "en"]
