# engine.ai model registry — models.yaml (config, not code)
# ---------------------------------------------------------------------------
# ONE table: role -> {model_id, prompt_version, max_tokens, temperature,
# breaker caps}. Loaded + schema-validated by engine.ai.registry (cached);
# every AI call site resolves its model + prompt version here.
#
# VALUE-FREEZE (read before editing model_id values):
#   The corpus goldens byte-freeze "claude-opus-4-7" into
#   corpus/hu_ai_lane/expected/* (extraction.model, classification.model),
#   stored prod envelopes carry it in ai_audit (the AI-lane cache key), and
#   tests/engine/test_ai_lane.py locks "all lane stages call the ONE
#   MODEL_ID". The registry cutover is therefore VALUE-IDENTICAL: flipping
#   any of the four wired lane/reconcile model ids below is a deliberate
#   golden-refreeze event (UPDATE_GOLDEN=1 + a `golden-change:` PR line +
#   relaxing the one-model invariant in test_ai_lane.py), never a casual
#   edit. The operator's declared TARGETS once that refreeze is scheduled:
#     - ai_validator, reconcile_proposal, extract, classify -> the current
#       Anthropic flagship "claude-fable-5"  (ai_validator already ships
#       on it — the role is new, no golden pins it)
#     - format_detect -> the cheaper tier "claude-haiku-4-5-20251001"
#   DEPLOY CHECK: verify both target model-id strings against the live
#   Anthropic models endpoint at deploy time (scripts/check_anthropic_probe
#   .py reports registry + credential state; model ids change with releases).
#
# temperature is pinned 0 for every role (registry validation enforces it).
# NOTE: the existing call sites do not yet PASS temperature on requests —
# the value documents the contract; wiring it into request kwargs is a
# separate behavior change (see docs/decisions/ADR-ai-spend-breaker.md).
#
# breaker: per-role DAILY spend caps consumed by engine.ai.breaker.
# Conservative defaults sized for a single-tenant VPS: a tripped role
# degrades to the honest "advisory unavailable" state and serving proceeds
# regardless — caps here are cost armor, never a serving gate. 0 means the
# role is fully closed (used by tests; also an ops kill-switch).

schema: ai_model_registry_v1

defaults:
  temperature: 0
  breaker:
    max_calls_per_day: 200
    max_tokens_per_day: 2000000

roles:
  format_detect:
    # Target after the deliberate refreeze: claude-haiku-4-5-20251001
    # (cheap tier; blocked today only by the one-model lane invariant).
    model_id: claude-opus-4-7
    prompt_version: format_detect_v1
    max_tokens: 2000
    temperature: 0
    breaker:
      max_calls_per_day: 500
      max_tokens_per_day: 2000000

  extract:
    # Target after the deliberate golden refreeze: claude-fable-5.
    model_id: claude-opus-4-7
    prompt_version: extract_v1
    max_tokens: 16000
    temperature: 0
    breaker:
      max_calls_per_day: 200
      max_tokens_per_day: 5000000

  classify:
    # Base version only — the pack-hash derivation
    # (classify_<jur>@<pack_hash[:12]>, frozen alias 'classify_v1' for the
    # exact v1 pack contents) COMPOSES ON TOP in engine.ai_lane.config.
    # Target after the deliberate golden refreeze: claude-fable-5.
    model_id: claude-opus-4-7
    prompt_version: classify_v1
    max_tokens: 16000
    temperature: 0
    breaker:
      max_calls_per_day: 200
      max_tokens_per_day: 5000000

  reconcile_proposal:
    # engine.api._reconcile AI_MODEL / PROMPT_VERSION — value-identical
    # wiring (stored receipts record these strings).
    # Target after the deliberate refreeze: claude-fable-5.
    model_id: claude-opus-4-7
    prompt_version: reconcile_v1
    max_tokens: 1024
    temperature: 0
    breaker:
      max_calls_per_day: 100
      max_tokens_per_day: 200000

  ai_validator:
    # THE advisory pass (engine.ai.advisory). New role — no golden pins
    # it, so it ships on the current Anthropic flagship per the operator
    # spec. VERIFY THIS STRING AT DEPLOY: "claude-fable-5" is the current
    # flagship model id; confirm against the live models endpoint before
    # enabling the pass in production.
    model_id: claude-fable-5
    prompt_version: ai_validator_v1
    max_tokens: 4096
    temperature: 0
    breaker:
      max_calls_per_day: 200
      max_tokens_per_day: 2000000

  narrative:
    # pipeline.stage_narrate's briefing model (value-identical to the
    # literal it uses today). Wiring the pipeline call site to this row
    # is the coordinator's one-liner — see the REG handoff notes.
    model_id: claude-opus-4-7
    prompt_version: narrative_v1
    max_tokens: 4096
    temperature: 0
    # DELIBERATE caps, not inherited defaults (2026-08-30). This role
    # writes the briefing AND backs finding sharpening, so it is the
    # busiest judgment role in the product. Sized for a single-tenant
    # VPS at roughly one full re-narration of every period per day with
    # headroom: a trip means the day's narration is exhausted, the
    # deterministic template carries all seven contract elements, and
    # serving is unaffected. Raise it here, visibly, rather than by
    # falling through to the global default.
    breaker:
      max_calls_per_day: 300
      max_tokens_per_day: 3000000

  finding_specificity:
    # THE ANTI-GENERIC NET — the adversarial self-review pass in
    # engine.ai.finding_sharpen. Its only question is "would this
    # sentence read identically for a DIFFERENT company?", scored 0..1
    # against the finding's own company profile and (when supplied) a
    # decoy company. A SECOND role on purpose: the drafting role is
    # `narrative`, and a writer grading its own output is not a net.
    # New role — no golden pins it, so it ships on the current flagship
    # (the ai_validator precedent). VERIFY the model-id string against
    # the live models endpoint at deploy.
    model_id: claude-fable-5
    prompt_version: finding_sharpen_review_v1
    max_tokens: 1024
    temperature: 0
    # DELIBERATE caps, not inherited defaults. The reviewer runs once per
    # drafted finding and at most twice when a draft is regenerated, so
    # it is call-heavy and token-light next to `narrative`: a period with
    # five surfaced findings costs at most ten calls. 300/day covers a
    # full re-narration of every period with headroom; a trip degrades
    # the whole lane to the deterministic template (model prose is never
    # shipped ungated) and serving is unaffected.
    breaker:
      max_calls_per_day: 300
      max_tokens_per_day: 1500000

  structural_interpreter_a:
    # AI-first-reader Part A — column-semantics-first framing of the
    # StructuralMap interpreter (engine.interp.interpreter). NEW role —
    # no golden pins it, so it ships on the current Anthropic flagship
    # (the ai_validator precedent above). The prompt_version participates
    # in the interp cache key (engine.interp.cache): bumping it
    # invalidates every cached map for this framing.
    model_id: claude-fable-5
    prompt_version: "smap1-a@1"
    max_tokens: 16000
    temperature: 0
    breaker:
      max_calls_per_day: 200
      max_tokens_per_day: 2000000

  structural_interpreter_b:
    # AI-first-reader Part A — row-topology-first framing (independent
    # second walkthrough of the same document for cross-checking). Same
    # notes as structural_interpreter_a.
    model_id: claude-fable-5
    prompt_version: "smap1-b@1"
    max_tokens: 16000
    temperature: 0
    breaker:
      max_calls_per_day: 200
      max_tokens_per_day: 2000000

  movement_review:
    # Advisory movement (rulaje) review — flags + movement-conditioned
    # classification proposals (engine.passes.movement_review). New role —
    # no golden pins it; ships on the current flagship like ai_validator.
    # VERIFY the model-id string against the live models endpoint at deploy.
    model_id: claude-fable-5
    prompt_version: movement_review_v1
    max_tokens: 4096
    temperature: 0
    breaker:
      max_calls_per_day: 100
      max_tokens_per_day: 1000000

  firm_brief:
    # FIRM COCKPIT — "Brief me" (engine.api._firm_brief). Writes the
    # morning brief FROM the computed attention items: grouping prose,
    # priority rationale, a suggested reading order. It never ranks,
    # never sets a severity and never suppresses an item — the
    # deterministic order in engine.firm.digest is computed BEFORE the
    # call and is the only order the payload trusts; the model's order
    # ships labeled advisory. Every figure in its prose is a placeholder
    # resolved from a typed fact (engine.ai.numerals, enforce mode); a
    # raw digit is rejected at parse and the deterministic brief ships
    # instead. New role — no golden pins it, so it ships on the current
    # flagship (the ai_validator precedent). VERIFY the model-id string
    # against the live models endpoint at deploy.
    model_id: claude-fable-5
    prompt_version: firm_brief_v1
    max_tokens: 2048
    temperature: 0
    # DELIBERATE caps, not inherited defaults. One brief per (firm, day,
    # item-set) is cached, so a firm costs a handful of calls a day even
    # when its items churn; 100/day covers a multi-firm host with
    # headroom. A trip degrades to the deterministic brief — the reader
    # still gets every item, in the same order, with a notice — and
    # nothing else in the cockpit is affected.
    breaker:
      max_calls_per_day: 100
      max_tokens_per_day: 500000

  radar_explain:
    # RADAR — AI explanation, in its lane (engine.radar.explain). For
    # each SURFACED, already-ranked, already-capped finding it attaches
    # the why-here paragraph and the action list (EN + RO) through the
    # findings contract's ONE advisory seam, drafted by the `narrative`
    # role and gated by the `finding_specificity` reviewer — this row
    # never drafts on its own. It never ranks, never sets a severity,
    # never caps and never dismisses: it receives a read-only projection
    # of the finished rows and returns prose fields only. Numerals in
    # its prose are resolved placeholders only; a raw digit is rejected
    # at parse, regenerated once, then the deterministic template ships
    # — and the SERVED text (cache included) is guarded again. The
    # prompt_version is half of the cache key (org, period, snapshot
    # hash, finding id, prompt version); bump it to invalidate every
    # cached explanation. model_id is INFORMATIONAL — it mirrors
    # `narrative`, the role that actually drafts, and a test holds the
    # two in step so this row cannot drift into claiming a model it does
    # not use. VERIFY the string against the live models endpoint at
    # deploy, as for every other role.
    model_id: claude-opus-4-7
    prompt_version: radar_explain_v1
    max_tokens: 4096
    temperature: 0
    # DELIBERATE caps, not inherited defaults. One lane call is counted
    # per explained finding (the drafting and reviewing roles count
    # their own calls on top), only an EARNED explanation is cached, and
    # the route never awaits this lane before its rows go out. 150/day
    # covers every surfaced finding of every period on a single-tenant
    # VPS being re-explained once with headroom. A trip means "no more
    # explanations today": every row still ships, with its deterministic
    # why-here and action list and an honest `explanation: absent`
    # marker, and nothing else in Radar is affected.
    breaker:
      max_calls_per_day: 150
      max_tokens_per_day: 1500000
