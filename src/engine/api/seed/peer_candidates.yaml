# peer_candidates.yaml — Phase 3 seed for the peer_candidates table.
#
# Schema: supabase/schema_phase_industry_intelligence.sql → peer_candidates
#
# WHAT THIS SEEDS
# ===============
# Names-only peer candidates for the calibration industries. Surfaces in
# the IndustryPicker → PendingIndustryContext component as:
#   · "Typical peers" — external companies in the same industry
#   · Internal-brand callout — Sadu/Bucegi for Scandia, NOT peers
#
# IDEMPOTENCY
# ===========
# Loader keys on `(industry_key, company_name)` UNIQUE. Re-running is a
# no-op for already-seeded rows.
#
# RULES
# =====
# · `is_internal_brand_default: true` means this company is a BRAND
#   owned by the org being analyzed, not a competitor. The UI suppresses
#   it from peer comparison and shows it in an internal-brand note.
# · `country` is RO unless noted.
# · `source: internal_demo` — for the v1 seed list. Promote to
#   `verified` once we have public-records financials for the peer.
# · `has_uploaded_financials: false` — none of these have been onboarded.
#   The IndustryPicker shows them as names only.

# ──────────────────────────────────────────────────────────────────────
# Scandia Food calibration (packaged_canned_meat_prepared_foods)
# ──────────────────────────────────────────────────────────────────────
# Sadu and Bucegi are Scandia's own brand labels — they appear on the
# Scandia balance sheet as inventory SKUs, not as peer competitors. The
# `is_internal_brand_default` flag drives the picker's internal-brand
# callout so users don't try to "add Sadu as a peer".

- industry_key: packaged_canned_meat_prepared_foods
  company_name: Sadu
  country: RO
  source: internal_demo
  is_internal_brand_default: true
  has_uploaded_financials: false
  notes: "Internal brand within the Scandia Food portfolio — not a peer competitor."

- industry_key: packaged_canned_meat_prepared_foods
  company_name: Bucegi
  country: RO
  source: internal_demo
  is_internal_brand_default: true
  has_uploaded_financials: false
  notes: "Internal brand within the Scandia Food portfolio — not a peer competitor."

