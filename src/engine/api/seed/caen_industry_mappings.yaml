# caen_industry_mappings.yaml — Phase A seed for caen_industry_mappings
#
# Schema target: supabase/schema_phase_industry_intelligence.sql → caen_industry_mappings
#
# WHAT THIS FILE DOES
# ===================
# Maps each 4-digit Romanian CAEN code to ONE canonical industry_key from
# industries.yaml. This is the resolver path: when a company's CAEN comes
# in (from registry lookup or user input), we look it up here to derive
# both the precise industry and its parent industry (for benchmark fallback).
#
# match_quality FIELD
# ===================
# · 'exact'             — CAEN maps unambiguously to this industry
#                         (e.g. 1013 → packaged_canned_meat_prepared_foods).
#                         Confidence ≥ 0.85.
# · 'close'             — CAEN is a near-neighbor of the industry (e.g.
#                         4791 → retail_online_marketplace; covers all
#                         non-store retail, not just online).
#                         Confidence 0.65–0.80.
# · 'sector_fallback'   — CAEN is mapped to the sector parent because we
#                         don't have a sub-industry yet. Used for less
#                         common 4-digit codes. Confidence 0.40–0.55.
#                         These should be the FIRST candidates for upgrade
#                         to 'close' or 'exact' when sub-industries land.
#
# THE FOUR CALIBRATION ROWS (must be present after loader runs):
#   · 1013 → packaged_canned_meat_prepared_foods  (Scandia)
#   · 4511 → automotive_retail_distribution       (Porsche Romania)
#   · 6820 → real_estate_commercial_rental        (EEI Imobiliara)
#   · 7830 → employment_services                  (ELIT)
#
# CAEN_LABELS_RO are the official ANAF Romanian descriptions (truncated to
# ~80 chars where appropriate; the full label can be retrieved from the
# CAEN registry).

