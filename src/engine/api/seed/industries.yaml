# industries.yaml — Phase A seed for industry_profiles
#
# Schema target: supabase/schema_phase_industry_intelligence.sql → industry_profiles
#
# CONVENTIONS
# ===========
# · `key` is the canonical lookup string. Lowercase snake_case. Stable forever —
#   downstream caen_industry_mappings, benchmark_sets, peer_candidates and
#   company_industry_assignments all FK on this string. RENAMES = MIGRATIONS.
# · `display_name` is English-only product copy. `display_name_ro` is the
#   Romanian label shown inside the data layer (CAEN labels, dropdowns).
# · `sector` is the top-level umbrella (12 sectors total). It MUST also be the
#   key of a parent profile in this file (`parent_key: null`, `sector: <self>`).
# · `parent_key` points at the broader industry whose benchmarks we fall back
#   to when sub-industry coverage is missing. The four calibration cases:
#     - packaged_canned_meat_prepared_foods  → parent food_manufacturing
#     - automotive_retail_distribution       → parent trade_distribution_generic
#     - real_estate_commercial_rental        → parent real_estate
#     - employment_services                  → parent professional_services_generic
# · `caen_codes` lists the primary CAENs that resolve TO this industry.
#   This is a HINT for the loader to reverse-build caen_industry_mappings.yaml;
#   the authoritative CAEN map lives in that separate file.
# · `benchmark_depth` mirrors the spec: 'full' | 'level_1_public_summary' |
#   'trial_balance' | 'directional'. New industries default to 'directional'.
# · `confidence_default` is the baseline confidence we surface when an analysis
#   resolves to this industry via CAEN alone (no further signals).
#
# COUNT: 90 industries across 12 sectors. See `key` index at the bottom.

